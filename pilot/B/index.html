<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Aldine: Sign in</title>
<style>
  :root {
    --ink: #1b1c16;
    --ink-deep: #12130d;
    --paper: #faf8f2;
    --cream: #f3efe5;
    --line: #d7d0c1;
    --line-soft: #e5dfd2;
    --muted: #6b6558;
    --accent: #c4543a;
    --accent-deep: #a8422b;
    --danger: #a83220;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    color: var(--ink);
    background:
      radial-gradient(1100px 640px at 12% -10%, rgba(255, 252, 244, .95), rgba(255, 252, 244, 0) 62%),
      radial-gradient(900px 660px at 104% 112%, rgba(196, 84, 58, .075), rgba(196, 84, 58, 0) 62%),
      #e7e1d5;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button, input { font: inherit; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  ::selection { background: var(--accent); color: #fff9ef; }

  .shell {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
    width: min(1120px, 100%);
    min-height: min(760px, calc(100svh - 56px));
    overflow: hidden;
    border: 1px solid rgba(27, 28, 22, .16);
    border-radius: 20px;
    background: var(--paper);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .8) inset,
      0 2px 5px rgba(27, 28, 22, .04),
      0 44px 84px -46px rgba(27, 28, 22, .5);
    animation: settle .55s var(--ease) both;
  }

  /* ---------- brand panel ---------- */

  .brand-panel {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 40px 42px;
    color: var(--cream);
    background: radial-gradient(140% 110% at 20% 0%, #25261e 0%, #1a1b14 48%, #11120c 100%);
  }

  .brand-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(243, 239, 229, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(243, 239, 229, .055) 1px, transparent 1px);
    background-size: 76px 76px;
    -webkit-mask-image: radial-gradient(125% 105% at 8% 0%, #000 0%, rgba(0, 0, 0, .35) 62%, transparent 88%);
    mask-image: radial-gradient(125% 105% at 8% 0%, #000 0%, rgba(0, 0, 0, .35) 62%, transparent 88%);
    pointer-events: none;
  }

  .brand {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    width: max-content;
    color: var(--cream);
    text-decoration: none;
    border-radius: 6px;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    display: block;
    flex: none;
    color: #f0ece1;
    transition: color .18s var(--ease);
  }

  .brand:hover .brand-mark { color: #fffdf7; }

  .wordmark {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: .005em;
    transform: translateY(-1px);
  }

  .orbit {
    position: absolute;
    right: -216px;
    bottom: -268px;
    width: 660px;
    height: 660px;
    color: var(--cream);
    pointer-events: none;
    user-select: none;
  }

  /* ---------- form panel ---------- */

  .form-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px clamp(38px, 5.4vw, 64px);
    background: linear-gradient(180deg, #fbf9f4 0%, #f8f5ed 100%);
  }

  .form-wrap {
    width: min(100%, 372px);
  }

  .form-wrap.is-switching { animation: viewIn .24s var(--ease); }

  .title {
    margin: 0 0 30px;
    font-family: var(--serif);
    font-size: 52px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -.022em;
    color: var(--ink);
    text-wrap: balance;
  }

  .title:focus { outline: none; }

  .field {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .field + .field { margin-top: 19px; }

  .field > label {
    margin: 0 0 9px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: #5f594c;
  }

  .control { position: relative; }

  .input {
    width: 100%;
    height: 54px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #fffdf8;
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    box-shadow: 0 1px 0 rgba(27, 28, 22, .025);
    transition: border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
  }

  .input:hover { border-color: #bdb4a2; }

  .input:focus {
    outline: none;
    border-color: #2b2c23;
    background: #fffefa;
    box-shadow: 0 0 0 3px rgba(196, 84, 58, .16);
  }

  .input:-webkit-autofill {
    -webkit-text-fill-color: var(--ink);
    -webkit-box-shadow: 0 0 0 1000px #fffdf8 inset;
  }

  .field.is-invalid .input {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(168, 50, 32, .1);
  }

  .field.is-invalid .input:focus {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(168, 50, 32, .16);
  }

  .control .input { padding-right: 52px; }

  .reveal {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    padding: 0;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #6b6558;
    cursor: pointer;
    transition: background .15s var(--ease), color .15s var(--ease);
  }

  .reveal:hover { color: var(--ink); background: #f0ebe0; }

  .reveal:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .reveal svg { width: 19px; height: 19px; }
  .reveal .eye-closed { display: none; }
  .reveal[aria-pressed="true"] .eye-open { display: none; }
  .reveal[aria-pressed="true"] .eye-closed { display: block; }

  .error {
    margin: 8px 0 0;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--danger);
  }

  .remember-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 20px;
    margin-top: 20px;
  }

  .remember {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 13.5px;
    line-height: 1.3;
    color: #403c33;
    cursor: pointer;
    user-select: none;
  }

  .remember input {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .checkbox {
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    flex: none;
    border: 1.5px solid #b8af9d;
    border-radius: 5px;
    background: #fffdf8;
    transition: background .15s var(--ease), border-color .15s var(--ease);
  }

  .checkbox svg {
    width: 10px;
    height: 10px;
    color: #fbf8f0;
    opacity: 0;
    transform: scale(.7);
    transition: opacity .15s var(--ease), transform .15s var(--ease);
  }

  .remember input:checked + .checkbox {
    border-color: var(--ink);
    background: var(--ink);
  }

  .remember input:checked + .checkbox svg {
    opacity: 1;
    transform: scale(1);
  }

  .remember input:focus-visible + .checkbox {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .text-link {
    font-size: 13px;
    color: #5e594c;
    text-decoration: underline;
    text-decoration-color: #bdb5a5;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    border-radius: 2px;
    transition: color .15s var(--ease), text-decoration-color .15s var(--ease);
  }

  .text-link:hover {
    color: var(--accent-deep);
    text-decoration-color: var(--accent);
  }

  .submit {
    width: 100%;
    height: 54px;
    margin-top: 26px;
    padding: 0 20px;
    border: 0;
    border-radius: 9px;
    background: var(--ink);
    color: #f8f4ea;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background .18s var(--ease), transform .12s var(--ease);
  }

  .submit:hover { background: var(--accent); }
  .submit:active { transform: translateY(1px); }
  .submit:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .divider {
    height: 1px;
    margin: 23px 0;
    background: var(--line-soft);
  }

  .oauth {
    display: grid;
    gap: 10px;
  }

  .oauth-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 51px;
    padding: 0 48px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #fffdf8;
    color: var(--ink);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .005em;
    cursor: pointer;
    transition: border-color .16s var(--ease), background .16s var(--ease);
  }

  .oauth-btn:hover {
    border-color: #a99f8d;
    background: #f7f2e8;
  }

  .oauth-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .oauth-btn svg {
    position: absolute;
    left: 15px;
    width: 18px;
    height: 18px;
    flex: none;
  }

  .switch {
    margin: 24px 0 0;
    font-size: 13.5px;
    line-height: 1.5;
    text-align: center;
    color: var(--muted);
  }

  .switch a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
    border-radius: 2px;
    transition: color .15s var(--ease);
  }

  .switch a:hover { color: var(--accent-deep); }

  .legal {
    margin: 14px 0 0;
    font-size: 11.5px;
    line-height: 1.62;
    letter-spacing: .002em;
    text-align: center;
    color: #6d6759;
    text-wrap: pretty;
  }

  .legal a {
    color: #504b3f;
    text-decoration: underline;
    text-decoration-color: #c4bcac;
    text-underline-offset: 2px;
    border-radius: 2px;
    transition: color .15s var(--ease), text-decoration-color .15s var(--ease);
  }

  .legal a:hover {
    color: var(--accent-deep);
    text-decoration-color: currentColor;
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes viewIn {
    from { opacity: .2; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }

  @media (max-width: 880px) {
    body { padding: 20px; }

    .shell {
      grid-template-columns: 1fr;
      min-height: calc(100svh - 40px);
    }

    .brand-panel {
      min-height: 118px;
      justify-content: center;
      padding: 26px 28px;
    }

    .brand-mark { width: 26px; height: 26px; }
    .wordmark { font-size: 22px; }

    .orbit {
      width: 390px;
      height: 390px;
      right: -132px;
      bottom: -272px;
    }

    .form-panel {
      align-items: flex-start;
      padding: 44px 32px 48px;
    }

    .form-wrap {
      width: min(100%, 400px);
      margin: 0 auto;
    }

    .title { font-size: 44px; }
  }

  @media (max-width: 520px) {
    body { padding: 0; background: var(--paper); }

    .shell {
      min-height: 100svh;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .brand-panel {
      min-height: 104px;
      padding: 22px;
    }

    .form-panel { padding: 36px 22px 42px; }
    .form-wrap { width: 100%; }
    .title { font-size: 40px; margin-bottom: 28px; }
    .legal { font-size: 11px; }
  }

  @media (max-height: 780px) and (min-width: 881px) {
    .form-panel { padding-top: 34px; padding-bottom: 34px; }
    .title { margin-bottom: 24px; }
    .field + .field { margin-top: 16px; }
    .remember-row { margin-top: 16px; }
    .submit { margin-top: 22px; }
    .divider { margin: 19px 0; }
    .switch { margin-top: 20px; }
    .legal { margin-top: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<main class="shell">
  <div class="brand-panel">
    <a class="brand" href="#" aria-label="Aldine home">
      <svg class="brand-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true" focusable="false">
        <path d="M14 1.9 26.1 14 14 26.1 1.9 14 14 1.9Z" stroke="currentColor" stroke-width="1.3"/>
        <path d="M14 8.35 19.65 14 14 19.65 8.35 14 14 8.35Z" fill="#C4543A"/>
      </svg>
      <span class="wordmark">Aldine</span>
    </a>

    <svg class="orbit" viewBox="0 0 660 660" fill="none" aria-hidden="true" focusable="false">
      <circle cx="330" cy="330" r="318" stroke="currentColor" stroke-opacity=".17"/>
      <circle cx="330" cy="330" r="238" stroke="currentColor" stroke-opacity=".11"/>
      <circle cx="330" cy="330" r="158" stroke="currentColor" stroke-opacity=".08"/>
      <path d="M330 0v660M0 330h660" stroke="currentColor" stroke-opacity=".055"/>
      <path d="M330 12A318 318 0 0 1 648 330" stroke="#C4543A" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </div>

  <section class="form-panel" aria-labelledby="form-title">
    <div class="form-wrap">
      <h1 class="title" id="form-title" tabindex="-1">Sign in</h1>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required aria-describedby="email-error">
          <p class="error" id="email-error" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="control">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
            <button class="reveal" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="eye eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M2.8 12s3.4-6.2 9.2-6.2S21.2 12 21.2 12s-3.4 6.2-9.2 6.2S2.8 12 2.8 12Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <svg class="eye eye-closed" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M3.2 3.2 20.8 20.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M8.2 5.93A9.9 9.9 0 0 1 12 5.2c5.8 0 9.2 6.8 9.2 6.8a17.3 17.3 0 0 1-3.1 4.1M6.1 7.3A17 17 0 0 0 2.8 12s3.4 6.8 9.2 6.8a9.6 9.6 0 0 0 4.2-.94" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="error" id="password-error" role="alert" hidden></p>
        </div>

        <div class="remember-row" id="session-row">
          <label class="remember">
            <input type="checkbox" name="remember">
            <span class="checkbox" aria-hidden="true">
              <svg viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false">
                <path d="M2.2 6.3 4.8 8.8 9.8 3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>Remember me</span>
          </label>
          <a class="text-link" href="#reset">Forgot password?</a>
        </div>

        <button class="submit" type="submit" id="auth-submit">
          <span id="submit-label">Sign in</span>
        </button>
      </form>

      <div class="divider" role="presentation"></div>

      <div class="oauth">
        <button class="oauth-btn" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <button class="oauth-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
          <span>Continue with GitHub</span>
        </button>
      </div>

      <p class="switch">
        <a id="switch-link" href="#register">Create an account</a>
      </p>

      <p class="legal">By continuing, you agree to our <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</p>
    </div>
  </section>
</main>

<script>
  (() => {
    const formWrap = document.querySelector('.form-wrap');
    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const submitLabel = document.getElementById('submit-label');
    const switchLink = document.getElementById('switch-link');
    const sessionRow = document.getElementById('session-row');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const reveal = document.querySelector('.reveal');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    let mode = 'signin';

    function setError(input, node, message) {
      node.textContent = message;
      node.hidden = false;
      input.setAttribute('aria-invalid', 'true');
      input.closest('.field').classList.add('is-invalid');
    }

    function clearError(input, node) {
      if (node.hidden) return;
      node.textContent = '';
      node.hidden = true;
      input.removeAttribute('aria-invalid');
      input.closest('.field').classList.remove('is-invalid');
    }

    function clearErrors() {
      clearError(email, emailError);
      clearError(password, passwordError);
    }

    function setMode(next, options) {
      const opts = options || {};
      mode = next;
      const isRegister = mode === 'register';

      title.textContent = isRegister ? 'Create account' : 'Sign in';
      submitLabel.textContent = isRegister ? 'Create account' : 'Sign in';
      switchLink.textContent = isRegister ? 'Sign in' : 'Create an account';
      switchLink.setAttribute('href', isRegister ? '#signin' : '#register');
      sessionRow.hidden = isRegister;
      password.setAttribute('autocomplete', isRegister ? 'new-password' : 'current-password');
      document.title = isRegister ? 'Aldine: Create account' : 'Aldine: Sign in';

      clearErrors();

      if (opts.animate !== false && !reduceMotion.matches) {
        formWrap.classList.remove('is-switching');
        void formWrap.offsetWidth;
        formWrap.classList.add('is-switching');
      }

      if (opts.focus) title.focus({ preventScroll: true });
    }

    switchLink.addEventListener('click', (event) => {
      event.preventDefault();
      const next = mode === 'signin' ? 'register' : 'signin';
      history.replaceState(null, '', next === 'register' ? '#register' : '#signin');
      setMode(next, { focus: true });
    });

    reveal.addEventListener('click', () => {
      const showing = password.type === 'text';
      password.type = showing ? 'password' : 'text';
      reveal.setAttribute('aria-pressed', String(!showing));
      reveal.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      password.focus({ preventScroll: true });
    });

    email.addEventListener('input', () => clearError(email, emailError));
    password.addEventListener('input', () => clearError(password, passwordError));

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      clearErrors();

      const emailValue = email.value.trim();
      const passwordValue = password.value;
      let firstInvalid = null;

      if (!emailValue) {
        setError(email, emailError, 'Email is required.');
        firstInvalid = email;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
        setError(email, emailError, 'Email address is not valid.');
        firstInvalid = email;
      }

      if (!passwordValue) {
        setError(password, passwordError, 'Password is required.');
        firstInvalid = firstInvalid || password;
      } else if (mode === 'register' && passwordValue.length < 8) {
        setError(password, passwordError, 'Password must be at least 8 characters.');
        firstInvalid = firstInvalid || password;
      }

      if (firstInvalid) firstInvalid.focus();
    });

    if (location.hash === '#register') setMode('register', { animate: false });
  })();
</script>
</body>
</html>
