<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sundial</title>
<style>
  :root{
    --paper: oklch(0.983 0.006 85);
    --paper-2: oklch(0.962 0.008 84);
    --paper-input: oklch(0.996 0.003 90);
    --ink: oklch(0.205 0.015 150);
    --ink-hover: oklch(0.275 0.018 152);
    --ink-2: oklch(0.365 0.012 150);
    --muted: oklch(0.475 0.012 140);
    --line: oklch(0.895 0.008 88);
    --line-strong: oklch(0.835 0.010 88);
    --clay: oklch(0.63 0.145 42);
    --clay-ink: oklch(0.455 0.115 40);
    --clay-soft: oklch(0.63 0.145 42 / 0.16);
    --danger: oklch(0.52 0.175 27);
    --danger-soft: oklch(0.52 0.175 27 / 0.12);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Songti SC", serif;
    --r: 10px;
  }

  *,*::before,*::after{ box-sizing: border-box; }
  [hidden]{ display: none !important; }

  body{
    margin: 0;
    min-height: 100svh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  ::selection{ background: var(--clay-soft); color: var(--ink); }
  a{ color: inherit; }

  .frame{
    position: fixed;
    inset: clamp(10px, 1.2vw, 16px);
    border: 1px solid var(--line);
    pointer-events: none;
    z-index: 0;
  }
  .dial{
    position: fixed;
    right: -320px;
    bottom: -340px;
    width: min(780px, 76vw);
    height: auto;
    color: var(--ink);
    pointer-events: none;
    z-index: 0;
  }

  .page{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
    padding: clamp(24px, 3vw, 36px) clamp(24px, 5vw, 60px) clamp(22px, 2.6vw, 30px);
  }

  /* ---------- top bar ---------- */
  .top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-size: 12.5px;
  }
  .logo{
    display: inline-flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1;
  }
  .logo svg{ display: block; flex: none; }
  .logo:focus-visible{ outline: 2px solid var(--clay); outline-offset: 6px; border-radius: 3px; }

  .help{
    color: var(--ink-2);
    text-decoration: none;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
    transition: color .16s ease, border-color .16s ease;
  }
  .help:hover{ color: var(--ink); border-bottom-color: var(--line-strong); }

  /* ---------- centre column ---------- */
  .stage{
    flex: 1 0 auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(24px, 5vh, 56px) 0;
  }
  .auth{
    width: 100%;
    max-width: 384px;
    margin-block: auto;
  }

  h1{
    margin: 0 0 30px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(33px, 3.4vw, 43px);
    line-height: 1.04;
    letter-spacing: -0.024em;
    color: var(--ink);
  }
  h1::after{ content: "."; color: var(--clay); }

  /* ---------- provider row ---------- */
  .sso{
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    background: var(--paper-input);
    overflow: hidden;
  }
  .sso-btn{
    height: 44px;
    padding: 0 6px;
    border: 0;
    border-left: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.005em;
    cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  .sso-btn:first-child{ border-left: 0; }
  .sso-btn:hover{ background: var(--paper-2); color: var(--ink); }
  .sso-btn:active{ background: oklch(0.935 0.009 84); }
  .sso-btn:focus-visible{ outline: none; box-shadow: inset 0 0 0 2px var(--clay); }

  .rule{
    height: 1px;
    margin: 26px 0;
    border: 0;
    background: var(--line);
  }

  /* ---------- form ---------- */
  form{ display: flex; flex-direction: column; gap: 16px; }
  .field{ display: grid; gap: 7px; }
  .field label{
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.004em;
    color: var(--ink-2);
  }
  .label-row{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .label-row a{
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 1px;
    transition: color .16s ease, border-color .16s ease;
  }
  .label-row a:hover{ color: var(--clay-ink); border-bottom-color: var(--clay); }

  .field input{
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    background: var(--paper-input);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1;
    caret-color: var(--ink);
    appearance: none;
    transition: border-color .16s ease, box-shadow .16s ease;
  }
  .field input::placeholder{ color: oklch(0.63 0.012 90); }
  .field input:hover{ border-color: oklch(0.775 0.012 88); }
  .field input:focus{
    outline: none;
    border-color: var(--clay-ink);
    box-shadow: 0 0 0 3px oklch(0.63 0.145 42 / 0.28);
  }
  .field input:-webkit-autofill{
    -webkit-box-shadow: 0 0 0 100px var(--paper-input) inset;
    -webkit-text-fill-color: var(--ink);
  }
  .field.is-invalid input{
    border-color: var(--danger);
    box-shadow: 0 0 0 3px var(--danger-soft);
  }
  .err{ margin: 0; font-size: 12px; line-height: 1.4; color: var(--danger); }
  .err:empty{ display: none; }

  .input-wrap{ position: relative; }
  .input-wrap input{ padding-right: 46px; }
  .reveal{
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color .16s ease, background .16s ease;
  }
  .reveal:hover{ color: var(--ink); background: var(--paper-2); }
  .reveal:focus-visible{ outline: 2px solid var(--clay); outline-offset: 1px; }
  .reveal .icon-eye-off{ display: none; }
  .reveal.is-on .icon-eye{ display: none; }
  .reveal.is-on .icon-eye-off{ display: block; }

  .row{ margin-top: 2px; }
  .check{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    user-select: none;
  }
  .check input{
    position: absolute;
    width: 18px;
    height: 18px;
    margin: 0;
    opacity: 0;
  }
  .box{
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    flex: none;
    border: 1.5px solid var(--line-strong);
    border-radius: 5px;
    background: var(--paper-input);
    transition: background .15s ease, border-color .15s ease;
  }
  .box::after{
    content: "";
    width: 9px;
    height: 5px;
    margin-top: -2px;
    border-left: 1.7px solid var(--paper);
    border-bottom: 1.7px solid var(--paper);
    transform: rotate(-45deg) scale(.55);
    opacity: 0;
    transition: opacity .15s ease, transform .15s ease;
  }
  .check input:checked + .box{ background: var(--ink); border-color: var(--ink); }
  .check input:checked + .box::after{ opacity: 1; transform: rotate(-45deg) scale(1); }
  .check input:focus-visible + .box{ outline: 2px solid var(--clay); outline-offset: 2px; }

  .terms{
    margin: -2px 0 0;
    font-size: 12px;
    line-height: 1.55;
    color: var(--muted);
  }
  .terms a{
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 1px solid var(--line-strong);
    white-space: nowrap;
  }
  .terms a:hover{ color: var(--clay-ink); border-bottom-color: var(--clay); }

  .submit{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 48px;
    margin-top: 6px;
    padding: 0 16px;
    border: 0;
    border-radius: var(--r);
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.012em;
    cursor: pointer;
    transition: background .18s ease, transform .12s ease;
  }
  .submit:hover{ background: var(--ink-hover); }
  .submit:active{ transform: translateY(1px); }
  .submit:focus-visible{ outline: 2px solid var(--clay); outline-offset: 3px; }
  .submit:disabled{ cursor: progress; }
  .submit .arrow{ transition: transform .2s ease; }
  .submit:hover .arrow{ transform: translateX(3px); }
  .spinner{
    display: none;
    width: 14px;
    height: 14px;
    border: 1.6px solid oklch(0.983 0.006 85 / 0.35);
    border-top-color: var(--paper);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .submit.is-busy .spinner{ display: block; }
  .submit.is-busy .arrow{ display: none; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .switch{
    margin: 26px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .switch a{
    margin-left: 4px;
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 1px;
    transition: color .16s ease, border-color .16s ease;
  }
  .switch a:hover{ color: var(--clay-ink); border-bottom-color: var(--clay); }
  .switch a:focus-visible{ outline: 2px solid var(--clay); outline-offset: 3px; border-radius: 2px; }

  /* ---------- footer ---------- */
  .foot{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--muted);
  }
  .foot-links{ display: flex; gap: 16px; }
  .foot-links a{ color: inherit; text-decoration: none; transition: color .16s ease; }
  .foot-links a:hover{ color: var(--ink); }

  a:focus-visible{ outline: 2px solid var(--clay); outline-offset: 3px; border-radius: 2px; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
    .submit:hover .arrow{ transform: none; }
  }

  @media (max-width: 640px){
    .frame, .dial{ display: none; }
    .page{ padding: 20px 20px 18px; }
    .stage{ padding: 26px 0 20px; }
    h1{ margin-bottom: 26px; }
    .rule{ margin: 22px 0; }
    .field input{ font-size: 16px; }
    .foot{ font-size: 11px; }
  }
</style>
</head>
<body>

<div class="frame" aria-hidden="true"></div>
<svg class="dial" viewBox="0 0 620 620" aria-hidden="true" focusable="false">
  <g fill="none" stroke="currentColor">
    <circle cx="310" cy="310" r="300" stroke-opacity=".08" stroke-width="1"/>
    <circle cx="310" cy="310" r="262" stroke-opacity=".15" stroke-width="16" stroke-dasharray="1.4 33"/>
    <circle cx="310" cy="310" r="196" stroke-opacity=".08" stroke-width="1"/>
  </g>
</svg>

<div class="page">
  <header class="top">
    <a class="logo" href="#" aria-label="Sundial home">
      <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.4"/>
        <path d="M12 12V3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M12 12l6.1 6.1" stroke="currentColor" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="2" fill="var(--clay)"/>
      </svg>
      <span>Sundial</span>
    </a>
    <a class="help" href="mailto:help@sundial.app">Need help?</a>
  </header>

  <main class="stage">
    <section class="auth" aria-labelledby="heading">
      <h1 id="heading">Sign in</h1>

      <div class="sso" role="group" aria-label="Continue with a provider">
        <button type="button" class="sso-btn">Google</button>
        <button type="button" class="sso-btn">Apple</button>
        <button type="button" class="sso-btn">GitHub</button>
      </div>

      <hr class="rule">

      <form id="auth-form" novalidate>
        <div class="field" data-only="signup" hidden>
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" spellcheck="false" aria-describedby="name-err">
          <p class="err" id="name-err"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" spellcheck="false" autocapitalize="none" aria-describedby="email-err">
          <p class="err" id="email-err"></p>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a id="forgot" href="mailto:help@sundial.app?subject=Password%20reset">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-err">
            <button class="reveal" id="reveal" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M2.2 12S5.8 5.8 12 5.8 21.8 12 21.8 12 18.2 18.2 12 18.2 2.2 12 2.2 12Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M4 4l16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M9.9 5.9A9.9 9.9 0 0 1 12 5.8c6.2 0 9.8 6.2 9.8 6.2a17.4 17.4 0 0 1-3.4 4.1M6.3 7.9A17.6 17.6 0 0 0 2.2 12S5.8 18.2 12 18.2c1.5 0 2.8-.35 4-.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10.3 10.3a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="err" id="password-err"></p>
        </div>

        <div class="row" id="remember-row">
          <label class="check">
            <input type="checkbox" id="remember" name="remember" checked>
            <span class="box" aria-hidden="true"></span>
            <span>Remember me</span>
          </label>
        </div>

        <p class="terms" id="terms" hidden>By creating an account you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>

        <button class="submit" type="submit" id="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submit-label">Sign in</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
            <path d="M2.75 8h10.5M9.25 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <p class="switch"><span id="switch-q">New to Sundial?</span><a href="#signup" id="switch-link">Create an account</a></p>
    </section>
  </main>

  <footer class="foot">
    <span>© 2026 Sundial</span>
    <span class="foot-links">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </span>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const $ = (sel, root = document) => root.querySelector(sel);
  const form = $('#auth-form');
  const nameInput = $('#name');
  const emailInput = $('#email');
  const passwordInput = $('#password');
  const reveal = $('#reveal');
  const submit = $('#submit');
  const submitLabel = $('#submit-label');
  const switchLink = $('#switch-link');
  const nameField = $('[data-only="signup"]');

  const COPY = {
    signin: {
      heading: 'Sign in',
      submit: 'Sign in',
      busy: 'Signing in',
      question: 'New to Sundial?',
      link: 'Create an account'
    },
    signup: {
      heading: 'Create account',
      submit: 'Create account',
      busy: 'Creating account',
      question: 'Already have an account?',
      link: 'Sign in'
    }
  };

  let mode = 'signin';

  const RULES = {
    name: value => value.trim().length > 1 ? '' : 'Enter your name.',
    email: value => {
      if (!value.trim()) return 'Email is required.';
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value.trim()) ? '' : 'Enter a valid email address.';
    },
    password: value => {
      if (!value) return 'Password is required.';
      return value.length >= 8 ? '' : 'Use at least 8 characters.';
    }
  };

  function setError(input, message) {
    const field = input.closest('.field');
    field.querySelector('.err').textContent = message;
    field.classList.toggle('is-invalid', Boolean(message));
    input.setAttribute('aria-invalid', message ? 'true' : 'false');
  }

  function clearErrors() {
    [nameInput, emailInput, passwordInput].forEach(input => setError(input, ''));
  }

  function validate() {
    const inputs = mode === 'signup' ? [nameInput, emailInput, passwordInput] : [emailInput, passwordInput];
    let firstInvalid = null;
    inputs.forEach(input => {
      const message = RULES[input.id](input.value);
      setError(input, message);
      if (message && !firstInvalid) firstInvalid = input;
    });
    return firstInvalid;
  }

  function resetReveal() {
    passwordInput.type = 'password';
    reveal.classList.remove('is-on');
    reveal.setAttribute('aria-pressed', 'false');
    reveal.setAttribute('aria-label', 'Show password');
  }

  function setMode(next, focus) {
    mode = next;
    const copy = COPY[next];
    const isSignup = next === 'signup';

    $('#heading').textContent = copy.heading;
    submitLabel.textContent = copy.submit;
    $('#switch-q').textContent = copy.question;
    switchLink.textContent = copy.link;
    switchLink.setAttribute('href', isSignup ? '#signin' : '#signup');
    switchLink.setAttribute('aria-label', isSignup ? 'Switch to sign in' : 'Switch to create an account');

    nameField.hidden = !isSignup;
    $('#forgot').hidden = isSignup;
    $('#remember-row').hidden = isSignup;
    $('#terms').hidden = !isSignup;

    passwordInput.setAttribute('autocomplete', isSignup ? 'new-password' : 'current-password');
    passwordInput.setAttribute('placeholder', isSignup ? 'At least 8 characters' : '');

    submit.classList.remove('is-busy');
    submit.disabled = false;
    clearErrors();
    resetReveal();

    if (focus) (isSignup ? nameInput : emailInput).focus({ preventScroll: true });
  }

  switchLink.addEventListener('click', event => {
    event.preventDefault();
    const next = mode === 'signin' ? 'signup' : 'signin';
    setMode(next, true);
    history.replaceState(null, '', next === 'signup' ? '#signup' : '#signin');
  });

  reveal.addEventListener('click', () => {
    const show = passwordInput.type === 'password';
    passwordInput.type = show ? 'text' : 'password';
    reveal.classList.toggle('is-on', show);
    reveal.setAttribute('aria-pressed', String(show));
    reveal.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    passwordInput.focus({ preventScroll: true });
  });

  [nameInput, emailInput, passwordInput].forEach(input => {
    input.addEventListener('input', () => {
      if (input.getAttribute('aria-invalid') === 'true') setError(input, '');
    });
  });

  form.addEventListener('submit', event => {
    event.preventDefault();
    const firstInvalid = validate();
    if (firstInvalid) {
      firstInvalid.focus({ preventScroll: true });
      return;
    }

    submit.classList.add('is-busy');
    submit.disabled = true;
    submitLabel.textContent = COPY[mode].busy;

    window.setTimeout(() => {
      submit.classList.remove('is-busy');
      submit.disabled = false;
      submitLabel.textContent = COPY[mode].submit;
    }, 900);
  });

  setMode(location.hash === '#signup' ? 'signup' : 'signin', false);
})();
</script>
</body>
</html>
