<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>待办</title>
<style>
  :root{
    --bg:#f7f6f2;
    --panel:#ffffff;
    --ink:#1f1e1a;
    --muted:#8b857b;
    --faint:#a8a299;
    --line:#eae6dd;
    --line-soft:#f1eee7;
    --accent:#3f6a52;
    --hover:#fbfaf6;
  }

  *{box-sizing:border-box}

  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  ::selection{background:#dfe8e0;color:#1f1e1a}

  .page{
    max-width:760px;
    margin:0 auto;
    padding:64px 24px 96px;
  }

  /* ---------- 页头 ---------- */

  .head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
  }

  h1{
    margin:0;
    font-size:30px;
    font-weight:600;
    letter-spacing:-0.015em;
    line-height:1.2;
  }

  .summary{
    margin:8px 0 0;
    font-size:13px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    letter-spacing:0.01em;
  }

  .head-date{
    padding-top:10px;
    font-size:12.5px;
    color:var(--faint);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- 筛选栏 ---------- */

  .toolbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-top:18px;
    padding:16px 0 14px;
    background:rgba(247,246,242,.92);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
  }

  .tabs{
    display:inline-flex;
    gap:2px;
    padding:3px;
    background:#edeae3;
    border-radius:11px;
  }

  .tab{
    appearance:none;
    border:0;
    background:transparent;
    font:inherit;
    font-size:13px;
    line-height:1.25;
    color:#6d685f;
    padding:7px 13px;
    border-radius:8px;
    cursor:pointer;
    display:inline-flex;
    align-items:baseline;
    gap:6px;
    white-space:nowrap;
    transition:background .18s ease,color .18s ease;
  }

  .tab:hover{background:rgba(255,255,255,.6);color:#26251f}

  .tab[aria-pressed="true"]{
    background:#23221d;
    color:#fbfaf6;
    box-shadow:0 1px 1px rgba(0,0,0,.14);
  }

  .tab .n{
    font-size:11px;
    opacity:.55;
    font-variant-numeric:tabular-nums;
  }

  .tab[aria-pressed="true"] .n{opacity:.65}

  .tab:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .search{
    position:relative;
    flex:0 1 264px;
    min-width:170px;
  }

  .search svg{
    position:absolute;
    left:11px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    color:#a8a299;
    pointer-events:none;
  }

  .search input{
    width:100%;
    padding:9px 12px 9px 32px;
    border:1px solid #e3dfd6;
    border-radius:10px;
    background:#fff;
    font:inherit;
    font-size:13.5px;
    color:#26251f;
    appearance:none;
    -webkit-appearance:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }

  .search input::placeholder{color:#a8a299}

  .search input:focus{
    outline:none;
    border-color:#bdb6a8;
    box-shadow:0 0 0 3px rgba(35,34,29,.06);
  }

  /* ---------- 列表 ---------- */

  .panel{
    margin-top:4px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 1px 2px rgba(30,27,22,.04), 0 10px 28px -22px rgba(30,27,22,.35);
    overflow:hidden;
  }

  .list{
    margin:0;
    padding:0;
    list-style:none;
  }

  .task{
    display:flex;
    align-items:flex-start;
    gap:13px;
    padding:16px 20px;
    border-top:1px solid var(--line-soft);
    transition:background .15s ease;
  }

  .task.first{border-top-color:transparent}

  .task:hover{background:var(--hover)}

  .task.is-hidden{display:none}

  .check{
    flex:0 0 19px;
    width:19px;
    height:19px;
    margin:2px 0 0;
    padding:0;
    appearance:none;
    -webkit-appearance:none;
    border:1.5px solid #cfcac0;
    border-radius:6px;
    background:#fff;
    cursor:pointer;
    position:relative;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }

  .check:hover{border-color:#a9a297}

  .check:active{transform:scale(.92)}

  .check:checked{
    background:var(--accent);
    border-color:var(--accent);
  }

  .check:checked::after{
    content:"";
    position:absolute;
    left:6px;
    top:2.5px;
    width:4px;
    height:9px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(42deg);
  }

  .check:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .body{min-width:0}

  .title{
    margin:0;
    font-size:14.5px;
    font-weight:500;
    color:#24231f;
    letter-spacing:0.005em;
    overflow-wrap:anywhere;
  }

  .meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px 14px;
    margin-top:6px;
  }

  .req{color:var(--muted)}

  .due-wrap{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12.5px;
    color:#8b857b;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .due-wrap svg{
    width:12px;
    height:12px;
    flex:none;
    opacity:.8;
  }

  .due-wrap.overdue{color:#b04a30}
  .due-wrap.today{color:#9a6b16}
  .due-wrap.soon{color:#7d776d}
  .due-wrap.later{color:#8b857b}
  .due-wrap.done{color:#b3aea5}

  .tags{
    display:inline-flex;
    flex-wrap:wrap;
    gap:6px;
  }

  .tag{
    font-size:11px;
    line-height:1.75;
    padding:0 8px;
    border-radius:999px;
    background:#f2efe8;
    color:#6f6a61;
    letter-spacing:0.01em;
    white-space:nowrap;
  }

  .task.done .title{
    color:#a8a39a;
    text-decoration:line-through;
    text-decoration-thickness:1px;
    text-decoration-color:#c9c4ba;
  }

  .task.done .meta{opacity:.62}

  /* ---------- 空状态 ---------- */

  .empty{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:56px 24px;
    text-align:center;
  }

  .empty.show{display:flex}

  .empty-title{
    margin:0;
    font-size:14px;
    font-weight:500;
    color:#6f6a61;
  }

  .empty-hint{
    margin:0;
    font-size:12.5px;
    color:var(--faint);
  }

  @media (max-width:620px){
    .page{padding:32px 16px 64px}

    h1{font-size:26px}

    .head-date{padding-top:6px;font-size:12px}

    .toolbar{
      flex-wrap:wrap;
      gap:10px;
      padding:12px 0;
    }

    .tabs{
      width:100%;
      justify-content:space-between;
    }

    .tab{
      flex:1;
      justify-content:center;
    }

    .search{
      flex:1 1 100%;
    }

    .task{padding:15px 16px;gap:11px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
  <main class="page">
    <header class="head">
      <div>
        <h1>待办</h1>
        <p class="summary" id="summary">4 项未完成 · 3 项已完成</p>
      </div>
      <div class="head-date" id="today"></div>
    </header>

    <div class="toolbar">
      <div class="tabs" role="group" aria-label="筛选任务">
        <button type="button" class="tab" data-filter="all" aria-pressed="true">
          全部<span class="n" data-count="all">7</span>
        </button>
        <button type="button" class="tab" data-filter="open" aria-pressed="false">
          未完成<span class="n" data-count="open">4</span>
        </button>
        <button type="button" class="tab" data-filter="done" aria-pressed="false">
          已完成<span class="n" data-count="done">3</span>
        </button>
      </div>

      <div class="search">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="9" cy="9" r="5.6"></circle>
          <path d="M13.2 13.2 17 17"></path>
        </svg>
        <input id="search" type="search" placeholder="搜索任务或标签" autocomplete="off" aria-label="搜索任务或标签">
      </div>
    </div>

    <section class="panel" aria-label="任务列表">
      <ul class="list" id="list">
        <li class="task" data-due="2026-11-22">
          <input class="check" type="checkbox" aria-label="切换「和设计确认新版导航稿」的完成状态">
          <div class="body">
            <p class="title">和设计确认新版导航稿</p>
            <div class="meta">
              <span class="due-wrap">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.1"></circle>
                  <path d="M8 4.9V8.1l2.1 1.3"></path>
                </svg>
                <span class="due">逾期 2 天</span>
              </span>
              <span class="tags"><span class="tag">设计</span><span class="tag">评审</span></span>
            </div>
          </div>
        </li>

        <li class="task" data-due="2026-11-24">
          <input class="check" type="checkbox" aria-label="切换「整理 Q3 用户访谈记录」的完成状态">
          <div class="body">
            <p class="title">整理 Q3 用户访谈记录</p>
            <div class="meta">
              <span class="due-wrap">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.1"></circle>
                  <path d="M8 4.9V8.1l2.1 1.3"></path>
                </svg>
                <span class="due">今天</span>
              </span>
              <span class="tags"><span class="tag">研究</span><span class="tag">产品</span></span>
            </div>
          </div>
        </li>

        <li class="task" data-due="2026-11-25">
          <input class="check" type="checkbox" aria-label="切换「修复登录页在 Safari 的样式错位」的完成状态">
          <div class="body">
            <p class="title">修复登录页在 Safari 的样式错位</p>
            <div class="meta">
              <span class="due-wrap">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.1"></circle>
                  <path d="M8 4.9V8.1l2.1 1.3"></path>
                </svg>
                <span class="due">明天</span>
              </span>
              <span class="tags"><span class="tag">前端</span><span class="tag">缺陷</span></span>
            </div>
          </div>
        </li>

        <li class="task" data-due="2026-11-28">
          <input class="check" type="checkbox" aria-label="切换「写 11 月数据复盘」的完成状态">
          <div class="body">
            <p class="title">写 11 月数据复盘</p>
            <div class="meta">
              <span class="due-wrap">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.1"></circle>
                  <path d="M8 4.9V8.1l2.1 1.3"></path>
                </svg>
                <span class="due">11月28日</span>
              </span>
              <span class="tags"><span class="tag">数据</span><span class="tag">周报</span></span>
            </div>
          </div>
        </li>

        <li class="task" data-due="2026-12-02">
          <input class="check" type="checkbox" aria-label="切换「准备下周产品评审的材料」的完成状态">
          <div class="body">
            <p class="title">准备下周产品评审的材料</p>
            <div class="meta">
              <span class="due-wrap">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.1"></circle>
                  <path d="M8 4.9V8.1l2.1 1.3"></path>
                </svg>
                <span class="due">12月2日</span>
              </span>
              <span class="tags"><span class="tag">产品</span><span class="tag">文档</span></span>
            </div>
          </div>
        </li>

        <li class="task done" data-due="2026-11-23">
          <input class="check" type="checkbox" checked aria-label="切换「更新本地部署文档」的完成状态">
          <div class="body">
            <p class="title">更新本地部署文档</p>
            <div class="meta">
              <span class="due-wrap done">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.1"></circle>
                  <path d="M8 4.9V8.1l2.1 1.3"></path>
                </svg>
                <span class="due">11月23日</span>
              </span>
              <span class="tags"><span class="tag">文档</span></span>
            </div>
          </div>
        </li>

        <li class="task done" data-due="2026-11-20">
          <input class="check" type="checkbox" checked aria-label="切换「给新同事开通仓库权限」的完成状态">
          <div class="body">
            <p class="title">给新同事开通仓库权限</p>
            <div class="meta">
              <span class="due-wrap done">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.1"></circle>
                  <path d="M8 4.9V8.1l2.1 1.3"></path>
                </svg>
                <span class="due">11月20日</span>
              </span>
              <span class="tags"><span class="tag">团队</span></span>
            </div>
          </div>
        </li>
      </ul>

      <div class="empty" id="empty" role="status">
        <p class="empty-title" id="empty-title">没有找到相关任务</p>
        <p class="empty-hint" id="empty-hint">换个关键词，或切换到「全部」</p>
      </div>
    </section>
  </main>

<script>
(function () {
  var tasks = Array.prototype.slice.call(document.querySelectorAll('.task'));
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var search = document.getElementById('search');
  var empty = document.getElementById('empty');
  var emptyTitle = document.getElementById('empty-title');
  var emptyHint = document.getElementById('empty-hint');
  var summary = document.getElementById('summary');
  var todayEl = document.getElementById('today');
  var counts = {
    all: document.querySelector('[data-count="all"]'),
    open: document.querySelector('[data-count="open"]'),
    done: document.querySelector('[data-count="done"]')
  };
  var filter = 'all';
  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  var now = new Date();
  todayEl.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + WEEK[now.getDay()];

  function startOfToday() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function pad(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function renderDue(task) {
    var wrap = task.querySelector('.due-wrap');
    var label = task.querySelector('.due');
    var d = new Date(task.dataset.due + 'T00:00:00');
    var dateText = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    var done = task.classList.contains('done');
    var diff = Math.round((d - startOfToday()) / 86400000);
    var text, tone;

    if (done) {
      text = dateText;
      tone = 'done';
    } else if (diff < 0) {
      text = '逾期 ' + (-diff) + ' 天';
      tone = 'overdue';
    } else if (diff === 0) {
      text = '今天';
      tone = 'today';
    } else if (diff === 1) {
      text = '明天';
      tone = 'soon';
    } else {
      text = dateText;
      tone = 'later';
    }

    label.textContent = text;
    wrap.className = 'due-wrap ' + tone;
    wrap.title = '截止 ' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function updateCounts() {
    var open = 0;
    var done = 0;
    tasks.forEach(function (task) {
      if (task.classList.contains('done')) done++; else open++;
    });
    counts.all.textContent = tasks.length;
    counts.open.textContent = open;
    counts.done.textContent = done;
    summary.textContent = open + ' 项未完成 · ' + done + ' 项已完成';
  }

  function matches(task) {
    var done = task.classList.contains('done');
    if (filter === 'open' && done) return false;
    if (filter === 'done' && !done) return false;

    var q = search.value.trim().toLowerCase();
    if (!q) return true;

    var tags = Array.prototype.map.call(task.querySelectorAll('.tag'), function (tag) {
      return tag.textContent;
    }).join(' ');

    return (task.querySelector('.title').textContent + ' ' + tags).toLowerCase().indexOf(q) !== -1;
  }

  function apply() {
    var visible = 0;

    tasks.forEach(function (task) {
      var ok = matches(task);
      task.classList.toggle('is-hidden', !ok);
      if (ok) {
        visible++;
        task.classList.toggle('first', visible === 1);
      } else {
        task.classList.remove('first');
      }
    });

    if (visible === 0) {
      var q = search.value.trim();
      if (q) {
        emptyTitle.textContent = '没有找到与「' + q + '」相关的任务';
        emptyHint.textContent = '换个关键词试试，或清空搜索';
      } else if (filter === 'done') {
        emptyTitle.textContent = '还没有已完成的任务';
        emptyHint.textContent = '勾选任务后，它会出现在这里';
      } else if (filter === 'open') {
        emptyTitle.textContent = '全部任务都完成了';
        emptyHint.textContent = '今天可以收工了';
      } else {
        emptyTitle.textContent = '暂无任务';
        emptyHint.textContent = '新建一条任务开始吧';
      }
      empty.classList.add('show');
    } else {
      empty.classList.remove('show');
    }
  }

  tasks.forEach(function (task) {
    renderDue(task);

    var check = task.querySelector('.check');
    check.addEventListener('change', function () {
      task.classList.toggle('done', check.checked);
      renderDue(task);
      updateCounts();
      apply();
    });
  });

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      filter = tab.dataset.filter;
      tabs.forEach(function (t) {
        t.setAttribute('aria-pressed', String(t === tab));
      });
      apply();
    });
  });

  var raf = 0;
  search.addEventListener('input', function () {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(apply);
  });

  search.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && search.value) {
      search.value = '';
      apply();
    }
  });

  updateCounts();
  apply();
})();
</script>
</body>
</html>
