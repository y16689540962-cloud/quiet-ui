<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>账户设置</title>
<style>
  :root{
    --paper:#f2f0ea;
    --surface:#faf9f5;
    --ink:#1b1c18;
    --ink-2:#3e4038;
    --muted:#6b6d62;
    --line:#ddd8cc;
    --line-2:#c8c2b2;
    --accent:#2b5a41;
    --accent-ink:#f3f1e8;
    --sans:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    --serif:"Songti SC", "Noto Serif SC", "Source Han Serif SC", "Iowan Old Style", Palatino, Georgia, serif;
    --num:"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  h1,h2,h3,p,ul{margin:0}
  ul{list-style:none;padding:0}
  a{color:var(--accent)}
  [hidden]{display:none !important}
  ::selection{background:#dbe4d9;color:var(--ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  .page{
    max-width:1000px;
    margin:0 auto;
    padding:64px 40px 96px;
  }
  .layout{
    display:grid;
    grid-template-columns:200px minmax(0,1fr);
    column-gap:clamp(32px, 6vw, 88px);
    align-items:start;
  }

  /* rail */
  .rail{position:sticky;top:64px}
  h1{
    font-family:var(--serif);
    font-size:30px;
    font-weight:600;
    line-height:1.3;
    letter-spacing:.01em;
    text-wrap:balance;
  }
  .nav{display:flex;flex-direction:column;gap:1px;margin-top:24px}
  .nav a{
    display:block;
    padding:6px 0;
    color:var(--muted);
    font-size:14px;
    text-decoration:none;
    transition:color .15s ease;
  }
  .nav a:hover{color:var(--ink)}
  .nav a[aria-current="true"]{color:var(--ink);font-weight:500}

  /* sections */
  .content{max-width:640px;padding-top:4px}
  .section + .section{margin-top:48px;padding-top:40px;border-top:1px solid var(--line)}
  h2{
    font-family:var(--serif);
    font-size:19px;
    font-weight:600;
    line-height:1.4;
    letter-spacing:.01em;
  }

  /* form */
  .avatar-block{display:flex;align-items:center;gap:16px;margin-top:24px}
  .avatar{
    width:68px;height:68px;flex:none;
    display:grid;place-items:center;
    border-radius:50%;
    overflow:hidden;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:var(--serif);
    font-size:26px;
    line-height:1;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}

  .form{margin-top:24px}
  .fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px}
  .field label{
    display:block;
    margin-bottom:8px;
    font-size:12.5px;
    color:var(--muted);
  }
  .input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line-2);
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    font-family:inherit;
    font-size:14.5px;
    line-height:1.4;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input:hover{border-color:#b5ae9c}
  .input:focus{
    outline:none;
    border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(27,28,24,.08);
  }
  .actions{display:flex;align-items:center;gap:14px;margin-top:24px}
  .status{font-size:13px;color:var(--accent);min-height:1em}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    padding:10px 16px;
    border:1px solid transparent;
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    line-height:1;
    text-decoration:none;
    cursor:pointer;
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink);background:rgba(27,28,24,.03)}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:#f6f4ee;padding:10px 20px}
  .btn-primary:hover{background:#000;border-color:#000}
  .file-input:focus-visible + .btn-ghost{outline:2px solid var(--accent);outline-offset:2px}

  /* toggles */
  .prefs{margin-top:16px;border-top:1px solid var(--line-2)}
  .pref{
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:16px 0;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
    cursor:pointer;
  }
  .switch{position:relative;display:block;width:42px;height:24px;flex:none}
  .switch input{
    position:absolute;inset:0;z-index:1;
    width:100%;height:100%;margin:0;
    opacity:0;cursor:pointer;
  }
  .track{
    position:absolute;inset:0;
    border-radius:999px;
    background:#d5cfc1;
    transition:background-color .18s ease;
  }
  .track::before{
    content:"";
    position:absolute;top:3px;left:3px;
    width:18px;height:18px;
    border-radius:50%;
    background:#fffdf7;
    box-shadow:0 1px 2px rgba(27,28,24,.3);
    transition:transform .18s cubic-bezier(.32,.72,.36,1);
  }
  .pref:hover input:not(:checked) + .track{background:#cbc5b5}
  .switch input:checked + .track{background:var(--accent)}
  .switch input:checked + .track::before{transform:translateX(18px)}
  .switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:3px}

  /* billing */
  .plan{
    display:grid;
    grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
    margin-top:24px;
    padding:24px;
    border:1px solid var(--line-2);
    border-radius:12px;
    background:var(--surface);
  }
  .plan-next{padding-left:24px;border-left:1px solid var(--line)}
  .meta{font-size:12.5px;color:var(--muted)}
  .plan-name{
    margin-top:4px;
    font-family:var(--serif);
    font-size:20px;
    font-weight:600;
    line-height:1.4;
  }
  .plan-price{margin-top:2px;font-size:13.5px;color:var(--ink-2)}
  .plan-date{
    margin-top:4px;
    font-family:var(--num);
    font-size:17px;
    line-height:1.4;
    letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
  }

  .sub-head{
    margin-top:40px;
    font-family:var(--serif);
    font-size:15px;
    font-weight:600;
  }
  .invoices{width:100%;margin-top:12px;border-collapse:collapse}
  .invoices th{
    padding:0 0 8px;
    border-bottom:1px solid var(--line-2);
    color:var(--muted);
    font-size:12.5px;
    font-weight:400;
    text-align:left;
  }
  .invoices td{
    padding:12px 0;
    border-bottom:1px solid var(--line);
    color:var(--ink-2);
    font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  .invoices td:first-child{color:var(--ink)}
  .invoices .amount{font-family:var(--num);font-size:15px;color:var(--ink)}
  .invoices .cell-action{width:120px;text-align:right}
  .link{
    color:var(--accent);
    font-size:13.5px;
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:1px;
    transition:border-color .15s ease;
  }
  .link:hover{border-color:var(--accent)}

  @media (max-width:860px){
    .page{padding:40px 24px 96px}
    .layout{grid-template-columns:1fr;row-gap:40px}
    .rail{position:static}
    h1{font-size:26px}
    .nav{flex-direction:row;flex-wrap:wrap;column-gap:24px;margin-top:16px}
    .content{padding-top:0}
    .section + .section{margin-top:40px;padding-top:32px}
  }
  @media (max-width:560px){
    .fields{grid-template-columns:1fr}
    .plan{grid-template-columns:1fr;padding:20px}
    .plan-next{padding-left:0;padding-top:16px;border-left:0;border-top:1px solid var(--line)}
    .invoices .cell-action{width:96px}
    .avatar-block{gap:14px}
    .actions{flex-wrap:wrap}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="page">
  <div class="layout">

    <div class="rail">
      <h1>账户设置</h1>
      <nav class="nav" aria-label="设置分区">
        <a href="#profile" aria-current="true">个人资料</a>
        <a href="#notifications">通知偏好</a>
        <a href="#billing">账单</a>
      </nav>
    </div>

    <main class="content">

      <section class="section" id="profile" aria-labelledby="profile-title">
        <h2 id="profile-title">个人资料</h2>

        <div class="avatar-block">
          <div class="avatar">
            <img id="avatar-img" alt="" hidden>
            <span id="avatar-initial" aria-hidden="true">林</span>
          </div>
          <input class="sr-only file-input" type="file" id="avatar-file" accept="image/png,image/jpeg">
          <label class="btn btn-ghost" for="avatar-file">更换头像</label>
        </div>

        <form class="form" id="profile-form">
          <div class="fields">
            <div class="field">
              <label for="name">姓名</label>
              <input class="input" id="name" name="name" type="text" value="林清禾" autocomplete="name">
            </div>
            <div class="field">
              <label for="email">邮箱</label>
              <input class="input" id="email" name="email" type="email" value="qinghe.lin@example.com" autocomplete="email">
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">保存更改</button>
            <p class="status" id="save-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section class="section" id="notifications" aria-labelledby="notifications-title">
        <h2 id="notifications-title">通知偏好</h2>

        <ul class="prefs">
          <li>
            <label class="pref" for="notif-security">
              <span>安全提醒</span>
              <span class="switch">
                <input type="checkbox" role="switch" id="notif-security" checked>
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>
          </li>
          <li>
            <label class="pref" for="notif-billing">
              <span>账单与发票</span>
              <span class="switch">
                <input type="checkbox" role="switch" id="notif-billing" checked>
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>
          </li>
          <li>
            <label class="pref" for="notif-release">
              <span>新功能发布</span>
              <span class="switch">
                <input type="checkbox" role="switch" id="notif-release">
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>
          </li>
          <li>
            <label class="pref" for="notif-digest">
              <span>每周摘要</span>
              <span class="switch">
                <input type="checkbox" role="switch" id="notif-digest" checked>
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>
          </li>
          <li>
            <label class="pref" for="notif-marketing">
              <span>营销邮件</span>
              <span class="switch">
                <input type="checkbox" role="switch" id="notif-marketing">
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section class="section" id="billing" aria-labelledby="billing-title">
        <h2 id="billing-title">账单</h2>

        <div class="plan">
          <div class="plan-main">
            <p class="meta">当前套餐</p>
            <p class="plan-name">专业版</p>
            <p class="plan-price">每月 ¥88</p>
          </div>
          <div class="plan-next">
            <p class="meta">下一次扣款</p>
            <p class="plan-date">2026年12月12日</p>
          </div>
        </div>

        <h3 class="sub-head">发票</h3>
        <table class="invoices">
          <caption class="sr-only">发票列表</caption>
          <thead>
            <tr>
              <th scope="col">日期</th>
              <th scope="col">金额</th>
              <th scope="col"><span class="sr-only">下载</span></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2026年11月12日</td>
              <td class="amount">¥88.00</td>
              <td class="cell-action"><a class="link" href="#">下载 PDF</a></td>
            </tr>
            <tr>
              <td>2026年10月12日</td>
              <td class="amount">¥88.00</td>
              <td class="cell-action"><a class="link" href="#">下载 PDF</a></td>
            </tr>
            <tr>
              <td>2026年9月12日</td>
              <td class="amount">¥88.00</td>
              <td class="cell-action"><a class="link" href="#">下载 PDF</a></td>
            </tr>
          </tbody>
        </table>
      </section>

    </main>
  </div>
</div>

<script>
  const navLinks = Array.from(document.querySelectorAll(".nav a"));
  const sections = navLinks
    .map(link => document.getElementById(link.hash.slice(1)))
    .filter(Boolean);
  let queued = false;

  function syncNav() {
    const mark = window.scrollY + 150;
    let current = sections[0];
    for (const section of sections) {
      if (section.getBoundingClientRect().top + window.scrollY <= mark) current = section;
    }
    for (const link of navLinks) {
      if (current && link.hash === "#" + current.id) link.setAttribute("aria-current", "true");
      else link.removeAttribute("aria-current");
    }
    queued = false;
  }

  window.addEventListener("scroll", () => {
    if (!queued) {
      queued = true;
      requestAnimationFrame(syncNav);
    }
  }, { passive: true });
  syncNav();

  const avatarFile = document.getElementById("avatar-file");
  const avatarImg = document.getElementById("avatar-img");
  const avatarInitial = document.getElementById("avatar-initial");

  avatarFile.addEventListener("change", () => {
    const file = avatarFile.files && avatarFile.files[0];
    if (!file) return;
    if (avatarImg.src.startsWith("blob:")) URL.revokeObjectURL(avatarImg.src);
    avatarImg.src = URL.createObjectURL(file);
    avatarImg.hidden = false;
    avatarInitial.hidden = true;
  });

  const profileForm = document.getElementById("profile-form");
  const saveStatus = document.getElementById("save-status");
  let statusTimer;

  profileForm.addEventListener("submit", event => {
    event.preventDefault();
    saveStatus.textContent = "已保存";
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { saveStatus.textContent = ""; }, 2400);
  });
</script>
</body>
</html>
