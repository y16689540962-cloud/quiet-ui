<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sign in to Cairn</title>
<style>
  :root{
    --paper:#f7f3eb;
    --card:#fffdf8;
    --ink:#17130f;
    --ink-2:#3c342b;
    --muted:#6b6156;
    --line:#ded5c6;
    --line-strong:#c9bba4;
    --accent:#a2442a;
    --on-dark:#f4efe5;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:rgba(162,68,42,.18)}

  .shell{
    display:grid;
    grid-template-columns:minmax(300px,36%) 1fr;
    min-height:100vh;
    min-height:100svh;
  }

  .brand{
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    margin:16px;
    border-radius:3px;
    background:var(--ink);
    color:var(--on-dark);
    padding:30px 32px;
  }
  .lockup{
    display:inline-flex;
    align-items:center;
    gap:11px;
    align-self:flex-start;
    font-family:var(--serif);
    font-size:20px;
    line-height:1;
    letter-spacing:.01em;
  }
  .lockup svg{display:block;width:22px;height:22px}
  .pane{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 40px;
  }
  .form-wrap{width:100%;max-width:384px}

  h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:44px;
    line-height:1.05;
    letter-spacing:-.01em;
    margin:0 0 34px -2px;
  }

  label{
    display:block;
    margin:0 0 8px;
    font-size:13px;
    font-weight:500;
    color:var(--ink-2);
  }
  .field + .field{margin-top:18px}
  .label-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin:0 0 8px;
  }
  .label-row label{margin:0}

  input[type=email],
  input[type=password],
  input[type=text]{
    width:100%;
    height:46px;
    padding:0 14px;
    font:inherit;
    font-size:15px;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:3px;
    transition:border-color .14s ease, box-shadow .14s ease, background-color .14s ease;
  }
  input[type=email]:hover,
  input[type=password]:hover,
  input[type=text]:hover{border-color:#b9a68c}
  input[type=email]:focus,
  input[type=password]:focus,
  input[type=text]:focus{
    outline:none;
    border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(162,68,42,.15);
  }
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--ink);
    -webkit-box-shadow:0 0 0 100px var(--card) inset;
    caret-color:var(--ink);
  }

  a{
    color:var(--ink);
    text-decoration:underline;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
    text-decoration-color:#c4b7a3;
    transition:color .14s ease, text-decoration-color .14s ease;
  }
  a:hover{color:var(--accent);text-decoration-color:var(--accent)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

  .quiet{
    font-size:12.5px;
    color:var(--muted);
    text-decoration:none;
  }
  .quiet:hover{color:var(--accent);text-decoration:underline;text-decoration-color:var(--accent)}

  .input-shell{position:relative}
  .input-shell input{padding-right:46px}
  .pw-toggle{
    position:absolute;
    top:50%;
    right:6px;
    transform:translateY(-50%);
    display:grid;
    place-items:center;
    width:32px;
    height:32px;
    padding:0;
    background:none;
    border:0;
    border-radius:3px;
    color:var(--muted);
    cursor:pointer;
    transition:color .14s ease, background-color .14s ease;
  }
  .pw-toggle:hover{color:var(--ink);background:rgba(23,19,15,.06)}
  .pw-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .pw-toggle svg{display:block}

  .remember{
    display:flex;
    align-items:center;
    gap:9px;
    margin:18px 0 0;
    font-size:13.5px;
    font-weight:400;
    color:var(--ink-2);
    cursor:pointer;
  }
  .remember input{
    width:16px;
    height:16px;
    margin:0;
    accent-color:var(--accent);
    cursor:pointer;
  }

  .submit{
    width:100%;
    height:46px;
    margin-top:26px;
    font:inherit;
    font-size:14.5px;
    font-weight:500;
    color:var(--on-dark);
    background:var(--ink);
    border:1px solid var(--ink);
    border-radius:3px;
    cursor:pointer;
    transition:background-color .14s ease, border-color .14s ease, transform .06s ease;
  }
  .submit:hover{background:#2a241d;border-color:#2a241d}
  .submit:active{transform:translateY(1px)}
  .submit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .or{
    display:flex;
    align-items:center;
    gap:14px;
    margin:26px 0;
    color:var(--muted);
  }
  .or::before,
  .or::after{content:"";flex:1;height:1px;background:var(--line)}
  .or span{font-size:12.5px;letter-spacing:.02em}

  .oauth{display:grid;gap:10px}
  .provider{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    height:46px;
    padding:0 14px;
    font:inherit;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:3px;
    cursor:pointer;
    transition:background-color .14s ease, border-color .14s ease;
  }
  .provider:hover{background:#f2ede3;border-color:#b9a68c}
  .provider:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .provider svg{display:block;flex:none}

  .switch{
    margin:28px 0 0;
    text-align:center;
    font-size:13.5px;
    color:var(--muted);
  }

  @media (max-width:900px){
    .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .brand{
      justify-content:flex-start;
      margin:0;
      border-radius:0;
      padding:20px 24px;
      background:var(--paper);
      color:var(--ink);
      border-bottom:1px solid var(--line);
    }
    .lockup{font-size:19px;gap:10px}
    .lockup svg{width:21px;height:21px}
    .pane{align-items:flex-start;padding:40px 24px 64px}
    .form-wrap{margin:0 auto}
    h1{font-size:30px;margin-bottom:26px}
  }
  @media (max-width:380px){
    .pane{padding:32px 18px 56px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="shell">

  <aside class="brand">
    <div class="lockup">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <g fill="currentColor">
          <ellipse cx="12" cy="6.8" rx="4.2" ry="3"/>
          <ellipse cx="11" cy="14.2" rx="6.2" ry="3.4"/>
          <ellipse cx="12.4" cy="21.2" rx="8.2" ry="2.8"/>
        </g>
      </svg>
      <span>Cairn</span>
    </div>
  </aside>

  <main class="pane">
    <div class="form-wrap">
      <h1>Sign in</h1>

      <form action="#" method="post">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a class="quiet" href="#">Forgot password?</a>
          </div>
          <div class="input-shell">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="pw-toggle" type="button" aria-label="Show password">
              <svg class="eye" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1.6 10S4.7 4.8 10 4.8 18.4 10 18.4 10 15.3 15.2 10 15.2 1.6 10 1.6 10Z"/>
                <circle cx="10" cy="10" r="2.6"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="M1.6 10S4.7 4.8 10 4.8 18.4 10 18.4 10 15.3 15.2 10 15.2 1.6 10 1.6 10Z"/>
                <circle cx="10" cy="10" r="2.6"/>
                <path d="M3 3l14 14"/>
              </svg>
            </button>
          </div>
        </div>

        <label class="remember">
          <input type="checkbox" name="remember">
          <span>Remember me</span>
        </label>

        <button class="submit" type="submit">Sign in</button>
      </form>

      <div class="or"><span>or</span></div>

      <div class="oauth">
        <button class="provider" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <button class="provider" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
          <span>Continue with GitHub</span>
        </button>
      </div>

      <p class="switch"><a href="#">Create an account</a></p>
    </div>
  </main>

</div>

<script>
  (function () {
    var form = document.querySelector('form');
    var input = document.getElementById('password');
    var toggle = document.querySelector('.pw-toggle');
    var eye = toggle.querySelector('.eye');
    var eyeOff = toggle.querySelector('.eye-off');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
    });

    toggle.addEventListener('click', function () {
      var reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      toggle.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
      eye.toggleAttribute('hidden', reveal);
      eyeOff.toggleAttribute('hidden', !reveal);
    });
  })();
</script>
</body>
</html>
