<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸间 — 笔记</title>
<style>
  :root{
    --paper:#f4f1ea;
    --sheet:#fffdf7;
    --ink:#1a1815;
    --body:#4f4a43;
    --muted:#726c62;
    --line:#ddd6c7;
    --accent:#b0432a;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",ui-serif,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    --wrap:1120px;
    --pad:clamp(22px,5vw,48px);
  }

  *,*::before,*::after{box-sizing:border-box}

  html{scroll-behavior:smooth}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(900px 520px at 82% -8%,rgba(176,67,42,.07),transparent 62%),
      radial-gradient(700px 460px at -10% 12%,rgba(120,104,70,.07),transparent 60%);
    z-index:0;
  }

  ::selection{background:#e8d3c6;color:var(--ink)}

  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

  .shell{
    position:relative;
    z-index:1;
    max-width:var(--wrap);
    margin:0 auto;
    padding:0 var(--pad);
  }

  /* ---------- header ---------- */
  .site-head{
    position:relative;
    z-index:2;
    border-bottom:1px solid var(--line);
  }

  .site-head .shell{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    height:84px;
  }

  .brand{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:var(--serif);
    font-size:21px;
    letter-spacing:.06em;
    line-height:1;
  }

  .brand::before{
    content:"";
    width:18px;
    height:18px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    background:
      linear-gradient(var(--ink),var(--ink)) 4px 5px/8px 1.5px no-repeat,
      linear-gradient(var(--ink),var(--ink)) 4px 9px/6px 1.5px no-repeat,
      linear-gradient(var(--ink),var(--ink)) 4px 13px/7px 1.5px no-repeat;
  }

  .nav{
    display:flex;
    align-items:center;
    gap:clamp(18px,3vw,38px);
    font-size:15px;
    color:var(--muted);
  }

  .nav a{
    position:relative;
    padding:4px 0;
    transition:color .18s ease;
  }

  .nav a::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:-2px;
    height:1px;
    background:currentColor;
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .22s ease;
  }

  .nav a:hover{color:var(--ink)}
  .nav a:hover::after{transform:scaleX(1)}

  /* ---------- hero ---------- */
  .hero{
    display:grid;
    grid-template-columns:minmax(0,1.05fr) minmax(0,.75fr);
    align-items:center;
    gap:clamp(36px,6vw,84px);
    padding-block:clamp(64px,11vh,132px) clamp(72px,10vh,120px);
  }

  .hero h1{
    margin:0;
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(2.6rem,6.2vw,4.5rem);
    line-height:1.1;
    letter-spacing:-.01em;
    max-width:7.4em;
  }

  .hero h1 .accent{
    position:relative;
    white-space:nowrap;
  }

  .hero h1 .accent::after{
    content:"";
    position:absolute;
    left:.02em;
    right:.06em;
    bottom:-.1em;
    height:.045em;
    min-height:2px;
    background:var(--accent);
    border-radius:2px;
    opacity:.85;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:clamp(30px,5vh,46px);
    padding:0 26px;
    height:54px;
    border:0;
    border-radius:10px;
    background:var(--ink);
    color:#f7f4ec;
    font-family:var(--sans);
    font-size:16px;
    font-weight:500;
    letter-spacing:.02em;
    cursor:pointer;
    text-decoration:none;
    box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 14px 26px -18px rgba(26,24,21,.9);
    transition:transform .18s cubic-bezier(.2,.8,.3,1),background-color .18s ease,box-shadow .18s ease;
  }

  .cta svg{
    width:17px;
    height:17px;
    stroke:currentColor;
    stroke-width:1.7;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .18s ease;
  }

  .cta:hover{
    background:#2c2822;
    transform:translateY(-2px);
    box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 22px 34px -20px rgba(26,24,21,.85);
  }

  .cta:hover svg{transform:translateY(2px)}
  .cta:active{transform:translateY(0) scale(.985)}

  /* ---------- paper scene ---------- */
  .scene{
    position:relative;
    width:min(100%,360px);
    aspect-ratio:4/4.35;
    justify-self:end;
  }

  .sheet{
    position:absolute;
    inset:0;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--sheet);
  }

  .sheet--back{
    background:#ece5d6;
    border-color:#e2dac9;
    transform:rotate(-4.2deg) translate(-8px,12px);
  }

  .sheet--front{
    display:flex;
    flex-direction:column;
    transform:rotate(1.4deg);
    padding:clamp(26px,3vw,36px);
    overflow:hidden;
    box-shadow:0 1px 2px rgba(40,33,20,.06),0 30px 50px -34px rgba(40,33,20,.55);
  }

  .sheet--front::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:clamp(20px,2.4vw,28px);
    width:1px;
    background:rgba(176,67,42,.28);
  }

  .sheet--front::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:5px;
    background:linear-gradient(90deg,var(--accent),#c9684d 55%,#d8b18f);
    opacity:.75;
  }

  .note-title{
    height:16px;
    width:56%;
    border-radius:3px;
    background:#2a2620;
    opacity:.82;
    margin:6px 0 26px;
  }

  .note-line{
    height:9px;
    border-radius:3px;
    background:#e3dccd;
    margin-bottom:17px;
  }

  .note-line:nth-child(2){width:100%}
  .note-line:nth-child(3){width:92%}
  .note-line:nth-child(4){width:74%}
  .note-line:nth-child(5){width:88%}
  .note-line:nth-child(6){width:46%}
  .note-line:nth-child(7){width:82%}
  .note-line:nth-child(8){width:96%}
  .note-line:nth-child(9){width:61%}

  .note-line.tint{
    background:rgba(176,67,42,.34);
    position:relative;
  }

  .note-line.tint::after{
    content:"";
    position:absolute;
    top:-5px;
    right:-14px;
    width:2px;
    height:19px;
    background:var(--accent);
    animation:caret 1.15s steps(1,end) infinite;
  }

  @keyframes caret{0%,55%{opacity:1}56%,100%{opacity:0}}

  .note-tag{
    display:inline-block;
    align-self:flex-start;
    margin-top:auto;
    width:76px;
    height:24px;
    border:1px dashed rgba(176,67,42,.45);
    border-radius:4px;
    background:rgba(176,67,42,.06);
  }

  /* ---------- features ---------- */
  .features{
    border-top:1px solid var(--line);
    padding-block:clamp(46px,7vh,72px) clamp(72px,10vh,110px);
  }

  .feature-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .feature{
    padding:6px clamp(22px,3vw,40px) 0;
    border-left:1px solid var(--line);
  }

  .feature:first-child{border-left:0;padding-left:0}
  .feature:last-child{padding-right:0}

  .feature svg{
    width:26px;
    height:26px;
    stroke:var(--accent);
    stroke-width:1.5;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    margin-bottom:22px;
  }

  .feature h3{
    margin:0 0 10px;
    font-family:var(--serif);
    font-size:21px;
    font-weight:600;
    letter-spacing:.01em;
    line-height:1.4;
  }

  .feature p{
    margin:0;
    color:var(--body);
    font-size:15px;
    line-height:1.75;
    max-width:26em;
  }

  /* ---------- entrance ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .hero h1,.cta,.scene,.feature{animation:rise .62s cubic-bezier(.22,.75,.3,1) both}
  .cta{animation-delay:.08s}
  .scene{animation-delay:.14s}
  .feature:nth-child(1){animation-delay:.2s}
  .feature:nth-child(2){animation-delay:.27s}
  .feature:nth-child(3){animation-delay:.34s}

  /* ---------- responsive ---------- */
  @media (max-width:860px){
    .hero{
      grid-template-columns:1fr;
      padding-top:clamp(48px,8vh,84px);
      gap:52px;
    }

    .hero h1{max-width:9em}
    .scene{justify-self:start;width:min(78%,300px)}

    .feature-grid{grid-template-columns:1fr}

    .feature{
      border-left:0;
      border-top:1px solid var(--line);
      padding:26px 0 0;
      margin-top:26px;
    }

    .feature:first-child{border-top:0;margin-top:0;padding-top:0}
  }

  @media (max-width:520px){
    .site-head .shell{height:72px}
    .nav{gap:18px;font-size:14px}
    .cta{width:100%;justify-content:center}
    .scene{width:100%;max-width:300px}
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<header class="site-head">
  <div class="shell">
    <a class="brand" href="#" aria-label="纸间 首页">纸间</a>
    <nav class="nav" aria-label="主导航">
      <a href="#features">功能</a>
      <a href="#features">更新</a>
      <a href="#features">帮助</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero shell">
    <div>
      <h1>写下，整理，<span class="accent">随时找回。</span></h1>
      <button class="cta" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 19.5h15"/></svg>
        下载 Mac 版
      </button>
    </div>

    <div class="scene" aria-hidden="true">
      <div class="sheet sheet--back"></div>
      <div class="sheet sheet--front">
        <div class="note-title"></div>
        <div class="note-line"></div>
        <div class="note-line"></div>
        <div class="note-line tint"></div>
        <div class="note-line"></div>
        <div class="note-line"></div>
        <div class="note-line"></div>
        <div class="note-tag"></div>
      </div>
    </div>
  </section>

  <section class="features" id="features">
    <div class="shell">
      <div class="feature-grid">
        <article class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3.5h7.5L18.5 8v12.5h-12z"/>
            <path d="M13.5 3.5V8h5"/>
            <path d="M9 12.5h6"/><path d="M9 16.5h4"/>
          </svg>
          <h3>纯文本存储</h3>
          <p>每页笔记都是本地的 Markdown 文件，用任何编辑器打开都不会乱码。</p>
        </article>

        <article class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6" cy="6.5" r="2.6"/>
            <circle cx="6" cy="17.5" r="2.6"/>
            <circle cx="17.5" cy="12" r="2.6"/>
            <path d="M6 9.1v5.8"/><path d="M8.6 6.5h3.9a2.4 2.4 0 0 1 2.4 2.4v.7"/>
            <path d="M8.6 17.5h3.9a2.4 2.4 0 0 0 2.4-2.4v-.7"/>
          </svg>
          <h3>双向链接</h3>
          <p>输入 [[ 就能连到另一页笔记，被引用时反向链接自动列在页面下方。</p>
        </article>

        <article class="feature">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 8.6a12.5 12.5 0 0 1 17 0"/>
            <path d="M6.6 12a8 8 0 0 1 10.8 0"/>
            <path d="M9.7 15.3a3.6 3.6 0 0 1 4.6 0"/>
            <circle cx="12" cy="18.6" r=".9" fill="currentColor" stroke="none"/>
            <path d="M4 20 20 4"/>
          </svg>
          <h3>离线可用</h3>
          <p>断网也照常写，回到网络后自动同步，不会出现两个版本的冲突副本。</p>
        </article>
      </div>
    </div>
  </section>
</main>

</body>
</html>
