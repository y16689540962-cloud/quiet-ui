<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>登录 · Aster</title>
<style>
  :root{
    --ink:#111614;
    --ink-soft:#2a312e;
    --paper:#eeece6;
    --surface:#ffffff;
    --line:#e4e1db;
    --line-strong:#d5d2ca;
    --muted:#6f6d66;
    --accent:#1f6f5c;
    --accent-soft:#e9f2ee;
    --font:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100%;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:44px 24px;
    font-family:var(--font);
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 6% -8%, #fdfcf9 0%, rgba(253,252,249,0) 62%),
      radial-gradient(900px 620px at 104% 106%, #dfece6 0%, rgba(223,236,230,0) 60%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .shell{
    position:relative;
    display:grid;
    grid-template-columns:.95fr 1fr;
    width:min(100%,980px);
    min-height:624px;
    background:var(--surface);
    border:1px solid rgba(17,22,20,.07);
    border-radius:22px;
    overflow:hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 2px 6px rgba(17,22,20,.04),
      0 48px 90px -48px rgba(17,22,20,.42);
  }

  /* ---------- brand panel ---------- */
  .brand{
    position:relative;
    overflow:hidden;
    background:#0e1412;
    isolation:isolate;
  }
  .brand::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(115% 90% at 28% 18%, #000 28%, transparent 84%);
            mask-image:radial-gradient(115% 90% at 28% 18%, #000 28%, transparent 84%);
  }
  .brand::after{
    content:"";
    position:absolute;
    right:-190px;
    bottom:-220px;
    z-index:0;
    width:560px;
    height:560px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(58,168,137,.52) 0%, rgba(58,168,137,.14) 44%, rgba(58,168,137,0) 68%);
    filter:blur(6px);
  }
  .brand-art{
    position:absolute;
    top:-150px;
    left:-220px;
    z-index:1;
    width:740px;
    height:740px;
    color:#eaf4ef;
    opacity:.075;
    transform-origin:50% 50%;
    animation:spin 150s linear infinite;
  }
  .brand-badge{
    position:absolute;
    right:58px;
    bottom:58px;
    z-index:2;
    width:76px;
    height:76px;
    color:#4bb795;
    opacity:.9;
  }

  @keyframes spin{ to{ transform:rotate(360deg) } }

  /* ---------- form panel ---------- */
  .panel{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:52px clamp(32px,5.5vw,68px);
    background:var(--surface);
  }
  .form-wrap{
    width:100%;
    max-width:372px;
  }
  .logo{
    display:inline-flex;
    align-items:center;
    gap:10px;
    width:fit-content;
    color:var(--ink);
    text-decoration:none;
  }
  .logo-mark{
    display:grid;
    place-items:center;
    width:34px;
    height:34px;
    border-radius:10px;
    background:var(--accent-soft);
    color:var(--accent);
  }
  .logo-mark svg{width:19px;height:19px}
  .logo-word{
    font-size:19px;
    font-weight:650;
    letter-spacing:-.02em;
  }

  h1{
    margin:34px 0 26px;
    font-size:30px;
    line-height:1.15;
    font-weight:600;
    letter-spacing:-.02em;
  }

  .fields{display:grid; gap:16px}
  .field label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:550;
    letter-spacing:.01em;
    color:#454b48;
  }
  .label-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .label-row label{margin-bottom:8px}

  .input{
    width:100%;
    height:46px;
    padding:0 14px;
    font:inherit;
    font-size:15px;
    color:var(--ink);
    background:#fcfbf9;
    border:1px solid var(--line-strong);
    border-radius:11px;
    transition:border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .input::placeholder{color:#a8a59d}
  .input:hover{border-color:#bfbcb3}
  .input:focus{
    outline:none;
    background:#fff;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(31,111,92,.13);
  }

  .pw-field{position:relative}
  .pw-field .input{padding-right:46px}
  .pw-toggle{
    position:absolute;
    top:50%;
    right:6px;
    transform:translateY(-50%);
    display:grid;
    place-items:center;
    width:34px;
    height:34px;
    padding:0;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#8b8880;
    cursor:pointer;
    transition:background .16s ease, color .16s ease;
  }
  .pw-toggle:hover{background:#f1efea;color:var(--ink-soft)}
  .pw-toggle svg{width:18px;height:18px}
  .pw-toggle .eye-off{display:none}
  .pw-toggle[aria-pressed="true"] .eye-on{display:none}
  .pw-toggle[aria-pressed="true"] .eye-off{display:block}

  .forgot{
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    text-decoration:none;
    transition:color .16s ease;
  }
  .forgot:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

  .remember{
    display:flex;
    align-items:center;
    margin:18px 0 22px;
  }
  .check{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-size:14px;
    color:#3d4441;
    cursor:pointer;
    user-select:none;
  }
  .check input{
    appearance:none;
    -webkit-appearance:none;
    position:relative;
    width:18px;
    height:18px;
    margin:0;
    border:1.5px solid #c3c0b8;
    border-radius:5px;
    background:#fff;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .check input:hover{border-color:#a9a69d}
  .check input:checked{background:var(--accent);border-color:var(--accent)}
  .check input:checked::after{
    content:"";
    position:absolute;
    left:5px;
    top:1.5px;
    width:4px;
    height:8px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:48px;
    font:inherit;
    font-size:15px;
    font-weight:600;
    border-radius:11px;
    cursor:pointer;
    transition:background .16s ease, border-color .16s ease, transform .1s ease, box-shadow .16s ease;
  }
  .btn-primary{
    border:0;
    color:#fff;
    background:var(--ink);
    box-shadow:0 1px 2px rgba(17,22,20,.22), 0 12px 24px -14px rgba(17,22,20,.65);
  }
  .btn-primary:hover{background:#1b2421}
  .btn-primary:active{transform:translateY(1px)}

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:26px 0;
    font-size:12px;
    color:#8f8c84;
  }
  .divider::before,
  .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .oauth{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn-oauth{
    height:46px;
    font-size:14px;
    font-weight:550;
    color:#232a27;
    background:#fff;
    border:1px solid var(--line-strong);
  }
  .btn-oauth:hover{background:#faf9f6;border-color:#c6c3ba}
  .btn-oauth:active{transform:translateY(1px)}
  .btn-oauth svg{width:18px;height:18px;margin-right:9px;flex:none}

  .switch{
    margin:26px 0 0;
    text-align:center;
    font-size:14px;
    color:#66645d;
  }
  .switch a{
    color:var(--accent);
    font-weight:600;
    text-decoration:none;
  }
  .switch a:hover{text-decoration:underline;text-underline-offset:3px}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .input:focus-visible{outline:none}

  @media (max-width:860px){
    body{padding:20px 16px}
    .shell{grid-template-columns:1fr;min-height:0;border-radius:18px}
    .brand{display:none}
    .panel{padding:40px 24px 44px}
    h1{margin-top:30px}
  }

  @media (prefers-reduced-motion:reduce){
    .brand-art{animation:none}
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<main class="shell">
  <div class="brand" aria-hidden="true">
    <svg class="brand-art" viewBox="0 0 32 32" fill="none">
      <g stroke="currentColor" stroke-width="1" stroke-linecap="round">
        <path d="M16 2v28"/>
        <path d="M3.9 9l24.2 14"/>
        <path d="M28.1 9L3.9 23"/>
      </g>
    </svg>
    <svg class="brand-badge" viewBox="0 0 32 32" fill="none">
      <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M16 4v24"/>
        <path d="M5.6 10l20.8 12"/>
        <path d="M26.4 10L5.6 22"/>
      </g>
    </svg>
  </div>

  <section class="panel">
    <div class="form-wrap">
      <a class="logo" href="#" aria-label="Aster 首页">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
              <path d="M12 3v18"/>
              <path d="M4.2 7.5l15.6 9"/>
              <path d="M19.8 7.5L4.2 16.5"/>
            </g>
          </svg>
        </span>
        <span class="logo-word">Aster</span>
      </a>

      <h1>登录</h1>

      <form id="login-form">
        <div class="fields">
          <div class="field">
            <label for="email">邮箱</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="password">密码</label>
              <a class="forgot" href="#">忘记密码？</a>
            </div>
            <div class="pw-field">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="至少 8 位字符" minlength="8" required>
              <button class="pw-toggle" type="button" aria-label="显示密码" aria-pressed="false" aria-controls="password">
                <svg class="eye-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2.2 12S5.8 5.6 12 5.6 21.8 12 21.8 12 18.2 18.4 12 18.4 2.2 12 2.2 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.7"/>
                </svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 4l16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                  <path d="M9.9 5.9A10.7 10.7 0 0 1 12 5.6c6.2 0 9.8 6.4 9.8 6.4a17 17 0 0 1-3.2 4M6.1 7.6A17.6 17.6 0 0 0 2.2 12S5.8 18.4 12 18.4c1.4 0 2.6-.3 3.7-.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M9.9 9.9a3.1 3.1 0 0 0 4.3 4.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="remember">
          <label class="check">
            <input type="checkbox" name="remember" checked>
            <span>记住我</span>
          </label>
        </div>

        <button class="btn btn-primary" type="submit">登录</button>
      </form>

      <div class="divider"><span>或</span></div>

      <div class="oauth">
        <button class="btn btn-oauth" type="button" aria-label="使用 Google 登录">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h6.47a5.53 5.53 0 0 1-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82Z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24Z"/>
            <path fill="#FBBC05" d="M5.27 14.29a7.2 7.2 0 0 1 0-4.58V6.62H1.29a12 12 0 0 0 0 10.76l3.98-3.09Z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75Z"/>
          </svg>
          Google
        </button>
        <button class="btn btn-oauth" type="button" aria-label="使用 GitHub 登录">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.2-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.75.81 1.2 1.84 1.2 3.1 0 4.43-2.7 5.4-5.26 5.69.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/>
          </svg>
          GitHub
        </button>
      </div>

      <p class="switch">还没有账号？<a href="#">创建账号</a></p>
    </div>
  </section>
</main>

<script>
  (function () {
    var form = document.getElementById('login-form');
    var toggle = document.querySelector('.pw-toggle');
    var password = document.getElementById('password');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
    });

    toggle.addEventListener('click', function () {
      var visible = password.type === 'password';
      password.type = visible ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', String(visible));
      toggle.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
    });
  })();
</script>
</body>
</html>
