<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f6f2">
<title>账户设置</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f6f2;
    --surface: #fffefb;
    --ink: #1a1c19;
    --ink-2: #4c514a;
    --quiet: #6b7067;
    --line: #e4e2da;
    --line-strong: #d5d3c9;
    --accent: #2f5d4a;
    --accent-deep: #254b3b;
    --accent-wash: #e7eee9;
    --focus: 0 0 0 3px rgba(47, 93, 74, 0.2);
    --shadow: 0 1px 2px rgba(26, 28, 25, 0.05);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: var(--accent-wash);
    color: var(--accent);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .shell {
    max-width: 1000px;
    margin: 0 auto;
    padding: 64px 32px 120px;
    display: grid;
    grid-template-columns: 168px minmax(0, 1fr);
    gap: 64px;
    align-items: start;
  }

  .rail {
    position: sticky;
    top: 64px;
  }

  .rail nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .rail-link {
    position: relative;
    display: block;
    padding: 7px 0;
    color: var(--quiet);
    font-size: 13px;
    letter-spacing: 0.01em;
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .rail-link::before {
    content: "";
    position: absolute;
    left: -14px;
    top: 50%;
    width: 2px;
    height: 14px;
    border-radius: 2px;
    background: var(--accent);
    transform: translateY(-50%) scaleY(0);
    transform-origin: center;
    transition: transform 0.18s ease;
  }

  .rail-link:hover { color: var(--ink); }

  .rail-link.is-active {
    color: var(--ink);
    font-weight: 500;
  }

  .rail-link.is-active::before { transform: translateY(-50%) scaleY(1); }

  .rail-link:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: var(--focus);
    border-radius: 3px;
  }

  .content {
    min-width: 0;
    max-width: 704px;
  }

  h1 {
    margin: 0 0 40px;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 620;
    letter-spacing: -0.025em;
  }

  section { scroll-margin-top: 40px; }

  section + section { margin-top: 60px; }

  .section-head { margin-bottom: 2px; }

  h2 {
    margin: 0 0 12px;
    font-size: 15px;
    line-height: 1.4;
    font-weight: 600;
    letter-spacing: 0.005em;
  }

  .row {
    display: grid;
    grid-template-columns: 148px minmax(0, 1fr);
    gap: 24px;
    align-items: center;
    padding: 18px 0;
    border-top: 1px solid var(--line);
  }

  .row-label {
    color: var(--ink-2);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .field {
    width: 100%;
    max-width: 340px;
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .field:hover { border-color: #bfbdb2; }

  .field:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: var(--focus);
  }

  .avatar-field {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .avatar {
    flex: 0 0 auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-wash);
    color: var(--accent);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 500;
    overflow: hidden;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .avatar-field:has(#avatar-file:focus-visible) label[for="avatar-file"] {
    box-shadow: var(--focus);
  }

  .form-foot {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    margin-top: 2px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .save-state {
    color: var(--accent);
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .save-state.is-on { opacity: 1; }

  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 15px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:focus-visible {
    outline: none;
    box-shadow: var(--focus);
  }

  .btn-primary {
    background: var(--ink);
    color: #fffefb;
  }

  .btn-primary:hover { background: #050604; }

  .btn-quiet {
    background: var(--surface);
    border-color: var(--line-strong);
    box-shadow: var(--shadow);
  }

  .btn-quiet:hover { border-color: #bab8ad; }

  .btn-ghost { color: var(--quiet); }

  .btn-ghost:hover {
    color: var(--ink);
    background: rgba(26, 28, 25, 0.045);
  }

  .btn-ghost:disabled {
    color: #b8b6ac;
    background: none;
    cursor: not-allowed;
  }

  .toggles {
    display: block;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 16px 0;
    border-top: 1px solid var(--line);
    font-size: 14px;
    color: var(--ink-2);
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .toggle-row:hover { color: var(--ink); }

  .switch {
    position: relative;
    display: inline-flex;
    flex: 0 0 auto;
    width: 40px;
    height: 24px;
  }

  .switch input {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .track {
    display: block;
    position: relative;
    width: 40px;
    height: 24px;
    border-radius: 999px;
    background: #d2d4cc;
    transition: background 0.18s ease;
  }

  .track::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fffefb;
    box-shadow: 0 1px 2px rgba(26, 28, 25, 0.22);
    transition: transform 0.18s ease;
  }

  .switch input:checked + .track { background: var(--accent); }

  .switch input:checked + .track::after { transform: translateX(16px); }

  .switch input:focus-visible + .track { box-shadow: var(--focus); }

  .switch:hover .track { background: #c5c8bf; }

  .switch:hover input:checked + .track { background: var(--accent-deep); }

  .plan {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    max-width: 460px;
  }

  .plan h3 {
    margin: 0;
    font-size: 16px;
    line-height: 1.35;
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  .plan-price {
    margin: 2px 0 0;
    display: flex;
    align-items: baseline;
    gap: 5px;
    color: var(--quiet);
    font-size: 12px;
  }

  .plan-amount {
    color: var(--ink-2);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .row-value {
    margin: 0;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 14px;
    color: var(--ink);
  }

  .amount {
    color: var(--quiet);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  .link-btn {
    appearance: none;
    padding: 2px 2px;
    border: 0;
    background: none;
    color: var(--ink-2);
    font: inherit;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--line-strong);
    cursor: pointer;
    transition: color 0.15s ease, text-decoration-color 0.15s ease;
  }

  .link-btn:hover {
    color: var(--accent);
    text-decoration-color: var(--accent);
  }

  .link-btn:focus-visible {
    outline: none;
    border-radius: 3px;
    box-shadow: var(--focus);
  }

  .invoices { margin-top: 40px; }

  .invoices h3 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 600;
  }

  .table-wrap {
    overflow-x: auto;
    margin: 0 -2px;
    padding: 0 2px;
  }

  table {
    width: 100%;
    min-width: 440px;
    border-collapse: collapse;
    table-layout: fixed;
    font-variant-numeric: tabular-nums;
  }

  .c-invoice { width: 30%; }
  .c-date { width: 29%; }
  .c-amount { width: 19%; }
  .c-state { width: 15%; }
  .c-action { width: 38px; }

  th {
    padding: 0 12px 10px 0;
    border-bottom: 1px solid var(--line-strong);
    color: var(--quiet);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-align: left;
  }

  td {
    padding: 13px 12px 13px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: 0; }

  tbody td:nth-child(4) { color: var(--accent); }

  th:last-child,
  td:last-child { padding-right: 0; }

  .col-amount {
    text-align: right;
    padding-right: 24px;
  }

  .col-action {
    width: 38px;
    text-align: right;
  }

  .icon-btn {
    appearance: none;
    display: inline-grid;
    place-items: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: none;
    color: var(--quiet);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

  .icon-btn:hover {
    background: #eeede7;
    color: var(--ink);
  }

  .icon-btn:focus-visible {
    outline: none;
    box-shadow: var(--focus);
  }

  .icon-btn svg {
    width: 15px;
    height: 15px;
    display: block;
  }

  @media (max-width: 860px) {
    .shell {
      display: block;
      max-width: none;
      padding: 0 20px 64px;
    }

    .rail {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -20px 28px;
      padding: 12px 20px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .rail nav {
      flex-direction: row;
      gap: 26px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .rail nav::-webkit-scrollbar { display: none; }

    .rail-link {
      padding: 2px 0 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    .rail-link::before { display: none; }

    .rail-link.is-active { box-shadow: inset 0 -2px 0 var(--accent); }

    .content { max-width: none; }

    h1 {
      margin: 0 0 32px;
      font-size: 24px;
    }

    section + section { margin-top: 44px; }

    .form-foot {
      padding-top: 16px;
    }

    .toggle-row { padding: 15px 0; }

    .table-wrap { margin: 0 -20px; padding: 0 20px; }
  }

  @media (max-width: 620px) {
    .row {
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 16px 0;
      align-items: start;
    }

    .row-label { font-size: 12.5px; }

    .avatar-field { margin-top: 2px; }

    .field {
      max-width: none;
      height: 42px;
      font-size: 16px;
    }

    .plan {
      max-width: none;
      margin-top: 2px;
    }

    .invoices { margin-top: 32px; }

    .table-wrap {
      overflow: visible;
      margin: 0;
      padding: 0;
    }

    table {
      display: block;
      min-width: 0;
    }

    colgroup { display: none; }

    thead {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    tbody { display: block; }

    tbody tr {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 30px;
      grid-template-areas:
        "invoice amount action"
        "date status action";
      align-items: center;
      column-gap: 14px;
      row-gap: 2px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    tbody tr:last-child { border-bottom: 0; }

    tbody td {
      display: block;
      padding: 0;
      border: 0;
      overflow: visible;
      white-space: normal;
    }

    tbody td:nth-child(1) {
      grid-area: invoice;
      font-size: 13px;
      color: var(--ink);
    }

    tbody td:nth-child(2) {
      grid-area: date;
      font-size: 12px;
      color: var(--quiet);
    }

    tbody td:nth-child(3) {
      grid-area: amount;
      padding: 0;
      text-align: right;
      font-size: 13px;
      color: var(--ink);
    }

    tbody td:nth-child(4) {
      grid-area: status;
      justify-self: end;
      font-size: 12px;
      color: var(--accent);
    }

    tbody td:nth-child(5) {
      grid-area: action;
      align-self: center;
      padding: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="设置导航">
    <nav>
      <a class="rail-link is-active" href="#profile" aria-current="location">个人资料</a>
      <a class="rail-link" href="#notifications">通知偏好</a>
      <a class="rail-link" href="#billing">账单</a>
    </nav>
  </aside>

  <main class="content">
    <h1>账户设置</h1>

    <section id="profile" aria-labelledby="profile-heading">
      <div class="section-head">
        <h2 id="profile-heading">个人资料</h2>
      </div>
      <form id="profile-form">
        <div class="row">
          <span class="row-label">头像</span>
          <div class="avatar-field">
            <div class="avatar" id="avatar" aria-hidden="true">林</div>
            <label class="btn btn-quiet" for="avatar-file">更换头像</label>
            <input class="sr-only" id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp">
            <button class="btn btn-ghost" id="avatar-remove" type="button" disabled>移除</button>
          </div>
        </div>
        <div class="row">
          <label class="row-label" for="full-name">姓名</label>
          <input class="field" id="full-name" name="name" type="text" value="林知远" autocomplete="name" required>
        </div>
        <div class="row">
          <label class="row-label" for="email">邮箱</label>
          <input class="field" id="email" name="email" type="email" value="lin.zhiyuan@hey.com" autocomplete="email" required>
        </div>
        <div class="form-foot">
          <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
          <button class="btn btn-primary" type="submit">保存更改</button>
        </div>
      </form>
    </section>

    <section id="notifications" aria-labelledby="notifications-heading">
      <div class="section-head">
        <h2 id="notifications-heading">通知偏好</h2>
      </div>
      <div class="toggles">
        <label class="toggle-row">
          <span>评论与提及</span>
          <span class="switch">
            <input type="checkbox" checked>
            <span class="track" aria-hidden="true"></span>
          </span>
        </label>
        <label class="toggle-row">
          <span>每周使用报告</span>
          <span class="switch">
            <input type="checkbox" checked>
            <span class="track" aria-hidden="true"></span>
          </span>
        </label>
        <label class="toggle-row">
          <span>产品更新</span>
          <span class="switch">
            <input type="checkbox">
            <span class="track" aria-hidden="true"></span>
          </span>
        </label>
        <label class="toggle-row">
          <span>活动与优惠</span>
          <span class="switch">
            <input type="checkbox">
            <span class="track" aria-hidden="true"></span>
          </span>
        </label>
        <label class="toggle-row">
          <span>安全提醒</span>
          <span class="switch">
            <input type="checkbox" checked>
            <span class="track" aria-hidden="true"></span>
          </span>
        </label>
      </div>
    </section>

    <section id="billing" aria-labelledby="billing-heading">
      <div class="section-head">
        <h2 id="billing-heading">账单</h2>
      </div>
      <div class="rows">
        <div class="row">
          <span class="row-label">当前套餐</span>
          <div class="plan">
            <div>
              <h3>Pro</h3>
              <p class="plan-price"><span class="plan-amount">¥99</span><span>/ 月</span></p>
            </div>
            <button class="btn btn-quiet" type="button">更改套餐</button>
          </div>
        </div>
        <div class="row">
          <span class="row-label">下次扣款</span>
          <p class="row-value">2026年12月1日 <span class="amount">¥99.00</span></p>
        </div>
        <div class="row">
          <span class="row-label">付款方式</span>
          <p class="row-value">Visa 尾号 4242 <button class="link-btn" type="button">更新</button></p>
        </div>
      </div>

      <div class="invoices">
        <h3>发票</h3>
        <div class="table-wrap">
          <table>
            <colgroup>
              <col class="c-invoice">
              <col class="c-date">
              <col class="c-amount">
              <col class="c-state">
              <col class="c-action">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">发票编号</th>
                <th scope="col">日期</th>
                <th scope="col" class="col-amount">金额</th>
                <th scope="col">状态</th>
                <th scope="col" class="col-action"><span class="sr-only">下载</span></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>INV-2026-11</td>
                <td>2026年11月1日</td>
                <td class="col-amount">¥99.00</td>
                <td>已支付</td>
                <td class="col-action">
                  <button class="icon-btn" type="button" aria-label="下载发票 INV-2026-11">
                    <svg viewBox="0 0 15 15" fill="none" aria-hidden="true" focusable="false">
                      <path d="M7.5 2v8m0 0 3-3m-3 3-3-3M3 12.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </td>
              </tr>
              <tr>
                <td>INV-2026-10</td>
                <td>2026年10月1日</td>
                <td class="col-amount">¥99.00</td>
                <td>已支付</td>
                <td class="col-action">
                  <button class="icon-btn" type="button" aria-label="下载发票 INV-2026-10">
                    <svg viewBox="0 0 15 15" fill="none" aria-hidden="true" focusable="false">
                      <path d="M7.5 2v8m0 0 3-3m-3 3-3-3M3 12.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </td>
              </tr>
              <tr>
                <td>INV-2026-09</td>
                <td>2026年9月1日</td>
                <td class="col-amount">¥99.00</td>
                <td>已支付</td>
                <td class="col-action">
                  <button class="icon-btn" type="button" aria-label="下载发票 INV-2026-09">
                    <svg viewBox="0 0 15 15" fill="none" aria-hidden="true" focusable="false">
                      <path d="M7.5 2v8m0 0 3-3m-3 3-3-3M3 12.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </td>
              </tr>
              <tr>
                <td>INV-2026-08</td>
                <td>2026年8月1日</td>
                <td class="col-amount">¥99.00</td>
                <td>已支付</td>
                <td class="col-action">
                  <button class="icon-btn" type="button" aria-label="下载发票 INV-2026-08">
                    <svg viewBox="0 0 15 15" fill="none" aria-hidden="true" focusable="false">
                      <path d="M7.5 2v8m0 0 3-3m-3 3-3-3M3 12.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </td>
              </tr>
            </tbody>

  </main>
</div>

<script>
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('.rail-link'));
    var sections = links.map(function (link) {
      return document.querySelector(link.getAttribute('href'));
    });

    function setActive(id) {
      links.forEach(function (link) {
        var active = link.getAttribute('href') === '#' + id;
        link.classList.toggle('is-active', active);
        if (active) {
          link.setAttribute('aria-current', 'location');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    }

    var ticking = false;
    function syncActive() {
      var marker = window.scrollY + 140;
      var atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 10;
      var current = sections[0].id;
      sections.forEach(function (section) {
        if (atBottom || section.getBoundingClientRect().top + window.scrollY <= marker) {
          current = section.id;
        }
      });
      setActive(current);
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(syncActive);
      }
    }, { passive: true });
    syncActive();

    var form = document.getElementById('profile-form');
    var saveState = document.getElementById('save-state');
    var hideTimer;
    var clearTimer;

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      window.clearTimeout(hideTimer);
      window.clearTimeout(clearTimer);
      saveState.textContent = '已保存';
      saveState.classList.add('is-on');
      hideTimer = window.setTimeout(function () {
        saveState.classList.remove('is-on');
        clearTimer = window.setTimeout(function () {
          saveState.textContent = '';
        }, 220);
      }, 2200);
    });

    var avatar = document.getElementById('avatar');
    var fileInput = document.getElementById('avatar-file');
    var removeBtn = document.getElementById('avatar-remove');
    var photoUrl = null;

    fileInput.addEventListener('change', function () {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (photoUrl) window.URL.revokeObjectURL(photoUrl);
      photoUrl = window.URL.createObjectURL(file);
      var img = document.createElement('img');
      img.src = photoUrl;
      img.alt = '';
      avatar.replaceChildren(img);
      removeBtn.disabled = false;
    });

    removeBtn.addEventListener('click', function () {
      if (photoUrl) {
        window.URL.revokeObjectURL(photoUrl);
        photoUrl = null;
      }
      avatar.textContent = '林';
      fileInput.value = '';
      removeBtn.disabled = true;
    });
  }());
</script>
</body>
