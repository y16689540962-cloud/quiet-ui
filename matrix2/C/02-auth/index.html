<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sign in to Rivet</title>
<style>
  :root {
    --paper: #f2efe8;
    --surface: #fffdf8;
    --field: #fffefb;
    --ink: #1b1815;
    --ink-2: #575046;
    --ink-3: #857c6e;
    --line: #e6dfd1;
    --line-strong: #d5cbb9;
    --rust: #a8452a;
    --rust-dark: #8c3720;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--paper);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::selection { background: rgba(168, 69, 42, 0.18); }

  .auth {
    width: 100%;
    max-width: 396px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 34px 32px 30px;
    box-shadow:
      0 1px 1px rgba(27, 24, 21, 0.03),
      0 18px 40px -26px rgba(27, 24, 21, 0.28);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand svg {
    width: 22px;
    height: 22px;
    display: block;
    color: var(--rust);
  }

  .brand span {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  h1 {
    margin: 26px 0 0;
    font-family: var(--serif);
    font-size: 31px;
    font-weight: 500;
    line-height: 1.12;
    letter-spacing: -0.018em;
    color: var(--ink);
  }

  form { margin-top: 24px; }

  .field + .field { margin-top: 16px; }

  .field label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.002em;
    color: var(--ink-2);
  }

  .field input {
    width: 100%;
    height: 46px;
    padding: 0 13px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
  }

  .field input:hover { border-color: #c6baa4; }

  .field input:focus {
    outline: none;
    background: #ffffff;
    border-color: var(--rust);
    box-shadow: 0 0 0 3px rgba(168, 69, 42, 0.13);
  }

  .field input:-webkit-autofill {
    -webkit-text-fill-color: var(--ink);
    box-shadow: 0 0 0 60px var(--field) inset;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 16px;
  }

  .remember {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    color: var(--ink-2);
    cursor: pointer;
    user-select: none;
  }

  .remember input {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    margin: 0;
    display: inline-grid;
    place-content: center;
    background: var(--field);
    border: 1px solid #c9bda6;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.12s ease, border-color 0.12s ease;
  }

  .remember input::before {
    content: "";
    width: 8px;
    height: 4px;
    border-left: 1.6px solid #fbf7ef;
    border-bottom: 1.6px solid #fbf7ef;
    transform: translateY(-1px) rotate(-45deg) scale(0);
    transition: transform 0.1s ease;
  }

  .remember input:hover { border-color: #b3a489; }

  .remember input:checked {
    background: var(--rust);
    border-color: var(--rust);
  }

  .remember input:checked::before { transform: translateY(-1px) rotate(-45deg) scale(1); }

  .remember input:focus-visible {
    outline: 2px solid var(--rust);
    outline-offset: 2px;
  }

  a {
    color: var(--rust);
    font-size: 14px;
    text-decoration: none;
    text-underline-offset: 3px;
    transition: color 0.15s ease;
  }

  a:hover {
    color: var(--rust-dark);
    text-decoration: underline;
    text-decoration-thickness: 1px;
  }

  a:focus-visible {
    outline: 2px solid var(--rust);
    outline-offset: 3px;
    border-radius: 3px;
  }

  .btn-primary {
    width: 100%;
    height: 46px;
    margin-top: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.005em;
    color: #fbf7ef;
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 9px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.06s ease;
  }

  .btn-primary:hover {
    background: #2c2723;
    border-color: #2c2723;
  }

  .btn-primary:active { transform: translateY(1px); }

  .btn-primary:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(27, 24, 21, 0.18);
  }

  .divider {
    height: 0;
    margin: 24px 0;
    border: 0;
    border-top: 1px solid var(--line);
  }

  .social {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn-ghost {
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .btn-ghost:hover {
    background: #faf5e9;
    border-color: #c6baa4;
  }

  .btn-ghost:focus-visible {
    outline: none;
    border-color: var(--rust);
    box-shadow: 0 0 0 3px rgba(168, 69, 42, 0.13);
  }

  .btn-ghost svg {
    width: 17px;
    height: 17px;
    flex: none;
  }

  .switch {
    margin: 24px 0 0;
    font-size: 14px;
    color: var(--ink-3);
    text-align: center;
  }

  .switch a { font-weight: 500; }

  @media (max-width: 420px) {
    body { padding: 24px 16px; }
    .auth { padding: 28px 22px 24px; border-radius: 14px; }
    h1 { font-size: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<main class="auth">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" fill-rule="evenodd" d="M8.6 2h6.8A6.6 6.6 0 0 1 22 8.6v6.8a6.6 6.6 0 0 1-6.6 6.6H8.6A6.6 6.6 0 0 1 2 15.4V8.6A6.6 6.6 0 0 1 8.6 2ZM12 8.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4Z"/>
    </svg>
    <span>Rivet</span>
  </div>

  <h1>Sign in</h1>

  <form action="#" method="post">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <div class="row">
      <label class="remember">
        <input type="checkbox" name="remember" value="1">
        Remember me
      </label>
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn-primary" type="submit">Sign in</button>
  </form>

  <hr class="divider">

  <div class="social">
    <button class="btn-ghost" type="button" aria-label="Continue with Google">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
      </svg>
      Google
    </button>
    <button class="btn-ghost" type="button" aria-label="Continue with GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      GitHub
    </button>
  </div>

  <p class="switch"><a href="#">Create an account</a></p>
</main>
</body>
</html>
