<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨记：一个随手记的笔记应用</title>
<style>
  :root {
    --paper: #f7f4ed;
    --card: #fffdf7;
    --ink: #1b1917;
    --muted: #6f6a60;
    --line: #ddd6c8;
    --accent: #b13b26;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --serif: "Iowan Old Style", "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding-inline: clamp(20px, 5vw, 48px);
  }

  a:focus-visible,
  .download:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* 顶部导航 */
  .masthead { border-bottom: 1px solid var(--line); }

  .masthead .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    min-height: 72px;
  }

  .wordmark {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: inherit;
    text-decoration: none;
  }

  .masthead nav {
    display: flex;
    gap: clamp(20px, 3vw, 32px);
  }

  .masthead nav a {
    color: var(--muted);
    font-size: 0.9375rem;
    text-decoration: none;
    transition: color 0.16s ease;
  }

  .masthead nav a:hover { color: var(--ink); }

  /* 主标题区 */
  .hero .wrap {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
    align-items: center;
    gap: clamp(40px, 6vw, 96px);
    padding-block: clamp(64px, 9vw, 120px) clamp(64px, 8vw, 108px);
  }

  h1 {
    margin: 0 0 clamp(32px, 4vw, 44px);
    font-family: var(--serif);
    font-size: clamp(2.25rem, 5.2vw, 3.75rem);
    font-weight: 600;
    line-height: 1.28;
    letter-spacing: 0.01em;
    max-width: 15em;
  }

  .download {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding-inline: 30px;
    border: 0;
    font-family: inherit;
    cursor: pointer;
    border-radius: 10px;
    background: var(--ink);
    color: var(--paper);
    font-size: 1rem;
    font-weight: 500;
    transition: background-color 0.16s ease, transform 0.16s ease;
  }

  .download:hover { background: var(--accent); }
  .download:active { transform: translateY(1px); }

  .note {
    padding: clamp(24px, 3vw, 34px);
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    transform: rotate(-1.1deg);
  }

  .note p {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(1rem, 1.6vw, 1.125rem);
    line-height: 1.5;
    color: var(--ink);
  }

  .note p + p { margin-top: 18px; }

  .caret {
    display: inline-block;
    width: 2px;
    height: 1.05em;
    margin-left: 5px;
    vertical-align: -0.16em;
    background: var(--accent);
    animation: blink 1.1s steps(1, end) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* 功能介绍 */
  .features { border-top: 1px solid var(--line); }

  .features .wrap {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    padding-block: clamp(48px, 6vw, 76px) clamp(56px, 7vw, 92px);
  }

  .feature { padding-right: clamp(16px, 2vw, 30px); }

  .feature + .feature {
    padding-left: clamp(20px, 2.4vw, 36px);
    border-left: 1px solid var(--line);
  }

  .feature:last-child { padding-right: 0; }

  .feature h2 {
    margin: 0 0 10px;
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .feature p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9375rem;
    line-height: 1.75;
    text-wrap: balance;
  }

  @media (max-width: 860px) {
    .hero .wrap {
      grid-template-columns: minmax(0, 1fr);
      padding-block: clamp(48px, 8vw, 72px);
    }
    .note { transform: none; }
  }

  @media (max-width: 720px) {
    .features .wrap {
      grid-template-columns: minmax(0, 1fr);
      row-gap: 34px;
    }
    .feature { padding-right: 0; }
    .feature + .feature {
      padding-left: 0;
      padding-top: 34px;
      border-left: 0;
      border-top: 1px solid var(--line);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .caret { animation: none; }
    .download, .masthead nav a { transition: none; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="#top">墨记</a>
    <nav aria-label="主导航">
      <a href="#features">功能</a>
      <a href="#download">下载</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <h1>记下当时想到的，<br>之后还能找回来。</h1>
        <button class="download" id="download" type="button">下载 Mac 版</button>
      </div>
      <div class="note" aria-hidden="true">
        <p>周五前把采访稿整理完</p>
        <p>预算表在共享盘的 2024 文件夹</p>
        <p>问一下阿岚出差的时间<span class="caret"></span></p>
      </div>
    </div>
  </section>

  <section class="features" id="features" aria-label="功能">
    <div class="wrap">
      <article class="feature">
        <h2>离线可用</h2>
        <p>断网也能打开，写完就存在这台电脑上。</p>
      </article>
      <article class="feature">
        <h2>全文搜索</h2>
        <p>输入记得的一个词，翻到那条笔记。</p>
      </article>
      <article class="feature">
        <h2>Markdown 导出</h2>
        <p>笔记存成 .md 文件，哪个编辑器都能打开。</p>
      </article>
    </div>
  </section>
</main>

</body>
</html>
