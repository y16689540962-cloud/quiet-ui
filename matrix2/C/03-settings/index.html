<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账户设置</title>
<style>
  :root{
    color-scheme: light;
    --canvas:#f4f3ef;
    --surface:#fffefc;
    --ink:#191710;
    --ink-2:#4d4a41;
    --ink-3:#817c6f;
    --line:#e3dfd5;
    --line-hard:#cbc6b8;
    --accent:#a4401f;
    --ring:rgba(164,64,31,.16);
    --radius:8px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:rgba(164,64,31,.15)}

  .page{
    max-width:1000px;
    margin:0 auto;
    padding:64px 40px 80px;
  }

  .head{margin-bottom:40px}

  h1{
    margin:0;
    font-size:28px;
    font-weight:600;
    letter-spacing:-.02em;
    line-height:1.2;
  }

  .section{
    display:grid;
    grid-template-columns:184px minmax(0,1fr);
    gap:48px;
    padding:40px 0;
    border-top:1px solid var(--line);
  }

  h2{
    margin:0;
    font-size:15px;
    font-weight:600;
  }

  .body{
    display:flex;
    flex-direction:column;
    gap:24px;
    min-width:0;
  }

  /* avatar */
  .avatar-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .avatar{
    flex:none;
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ink);
    color:#f6f3ea;
    font-size:24px;
    font-weight:500;
    line-height:1;
  }
  .avatar-actions{display:flex;gap:8px}

  /* buttons */
  .btn{
    display:inline-flex;
    align-items:center;
    height:36px;
    padding:0 14px;
    border:1px solid transparent;
    border-radius:var(--radius);
    background:none;
    font:inherit;
    font-size:14px;
    font-weight:500;
    color:var(--ink-2);
    cursor:pointer;
    transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn-primary{background:var(--ink);color:#f8f5ee}
  .btn-primary:hover{background:#2b2820}
  .btn-ghost{background:var(--surface);border-color:var(--line-hard)}
  .btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* fields */
  .fields{display:flex;flex-direction:column;gap:20px;max-width:400px}
  .field{display:flex;flex-direction:column;gap:8px}
  .field label{font-size:13px;font-weight:500;color:var(--ink-2)}
  .field input{
    height:40px;
    padding:0 12px;
    border:1px solid var(--line-hard);
    border-radius:var(--radius);
    background:var(--surface);
    color:var(--ink);
    font:inherit;
    font-size:15px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:hover{border-color:var(--ink-3)}
  .field input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--ring);
  }
  .actions{display:flex;gap:8px}

  /* toggles */
  .toggles{display:flex;flex-direction:column}
  .toggle{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:16px 0;
    border-top:1px solid var(--line);
    cursor:pointer;
  }
  .toggle:first-child{border-top:0;padding-top:0}
  .toggle:last-child{padding-bottom:0}
  .toggle-text{font-size:15px;color:var(--ink)}
  .toggle input{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
  }
  .switch{
    position:relative;
    flex:none;
    width:40px;
    height:22px;
    border-radius:11px;
    background:#d5d0c3;
    transition:background-color .15s ease;
  }
  .switch::after{
    content:"";
    position:absolute;
    top:2px;
    left:2px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#fffdf7;
    box-shadow:0 1px 2px rgba(25,23,16,.25);
    transition:transform .15s ease;
  }
  .toggle input:checked + .switch{background:var(--accent)}
  .toggle input:checked + .switch::after{transform:translateX(18px)}
  .toggle input:focus-visible + .switch{box-shadow:0 0 0 3px var(--ring)}

  /* billing */
  .facts{display:flex;flex-direction:column;gap:24px}
  .fact{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }
  .fact-label{
    margin-bottom:4px;
    font-size:13px;
    font-weight:500;
    color:var(--ink-2);
  }
  .fact-value{display:flex;align-items:baseline;gap:8px;font-size:15px}
  .price{
    font-family:var(--mono);
    font-size:13px;
    font-variant-numeric:tabular-nums;
    color:var(--ink-3);
  }

  .invoices{width:100%;border-collapse:collapse;margin-top:4px}
  .invoices caption{
    padding-bottom:12px;
    text-align:left;
    font-size:13px;
    font-weight:500;
    color:var(--ink-2);
  }
  .invoices th{
    padding:0 0 8px;
    border-bottom:1px solid var(--line-hard);
    text-align:left;
    font-size:12px;
    font-weight:500;
    color:var(--ink-3);
  }
  .invoices td{
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
    color:var(--ink-2);
    white-space:nowrap;
  }
  .invoices td:first-child{color:var(--ink)}
  .invoices .c-amount{
    text-align:right;
    padding-right:32px;
  }
  .invoices td.c-amount{
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    font-size:14px;
    color:var(--ink);
  }
  .invoices .c-file{
    text-align:right;
    padding-left:24px;
    width:56px;
  }
  .dl{
    color:var(--accent);
    font-size:13px;
    font-weight:500;
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:1px;
  }
  .dl:hover{border-bottom-color:currentColor}
  .dl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
    border:0;
  }

  @media (max-width:820px){
    .page{padding:48px 24px 64px}
    .section{grid-template-columns:1fr;gap:20px;padding:32px 0}
    .head{margin-bottom:32px}
  }

  @media (max-width:520px){
    .page{padding:40px 16px 48px}
    h1{font-size:24px}
    .fact{flex-direction:column;align-items:flex-start;gap:12px}
    .invoices td,.invoices th{font-size:11px}
    .invoices td{font-size:13px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="page">

  <header class="head">
    <h1>账户设置</h1>
  </header>

  <main>
    <section class="section" aria-labelledby="profile">
      <h2 id="profile">个人资料</h2>
      <div class="body">
        <div class="avatar-row">
          <div class="avatar" aria-hidden="true">林</div>
          <div class="avatar-actions">
            <button type="button" class="btn btn-ghost">更换头像</button>
            <button type="button" class="btn btn-ghost" aria-label="移除头像">移除</button>
          </div>
        </div>

        <div class="fields">
          <div class="field">
            <label for="name">姓名</label>
            <input id="name" name="name" type="text" value="林知远" autocomplete="name">
          </div>
          <div class="field">
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" value="lin.zhiyuan@hey.com" autocomplete="email">
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary">保存更改</button>
            <button type="button" class="btn btn-ghost">取消</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="notifications">
      <h2 id="notifications">通知偏好</h2>
      <div class="body">
        <div class="toggles">
          <label class="toggle">
            <span class="toggle-text">新设备登录</span>
            <input type="checkbox" role="switch" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="toggle">
            <span class="toggle-text">账单与发票</span>
            <input type="checkbox" role="switch" checked>
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="toggle">
            <span class="toggle-text">用量提醒</span>
            <input type="checkbox" role="switch">
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="toggle">
            <span class="toggle-text">产品更新</span>
            <input type="checkbox" role="switch">
            <span class="switch" aria-hidden="true"></span>
          </label>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="billing">
      <h2 id="billing">账单</h2>
      <div class="body">
        <div class="facts">
          <div class="fact">
            <div>
              <div class="fact-label">当前套餐</div>
              <div class="fact-value">Pro 月付<span class="price">¥99.00/月</span></div>
            </div>
            <button type="button" class="btn btn-ghost">更改套餐</button>
          </div>
          <div class="fact">
            <div>
              <div class="fact-label">下一次扣款</div>
              <div class="fact-value">2026年12月3日</div>
            </div>
          </div>
        </div>

        <table class="invoices">
          <caption>发票</caption>
          <thead>
            <tr>
              <th scope="col">日期</th>
              <th scope="col" class="c-amount">金额</th>
              <th scope="col">状态</th>
              <th scope="col" class="c-file"><span class="sr-only">文件</span></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2026年11月3日</td>
              <td class="c-amount">¥99.00</td>
              <td>已支付</td>
              <td class="c-file"><a class="dl" href="#" aria-label="下载 2026年11月3日的发票">下载</a></td>
            </tr>
            <tr>
              <td>2026年10月3日</td>
              <td class="c-amount">¥99.00</td>
              <td>已支付</td>
              <td class="c-file"><a class="dl" href="#" aria-label="下载 2026年10月3日的发票">下载</a></td>
            </tr>
            <tr>
              <td>2026年9月3日</td>
              <td class="c-amount">¥99.00</td>
              <td>已支付</td>
              <td class="c-file"><a class="dl" href="#" aria-label="下载 2026年9月3日的发票">下载</a></td>
            </tr>
            <tr>
              <td>2026年8月3日</td>
              <td class="c-amount">¥99.00</td>
              <td>已支付</td>
              <td class="c-file"><a class="dl" href="#" aria-label="下载 2026年8月3日的发票">下载</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

</div>
</body>
</html>
