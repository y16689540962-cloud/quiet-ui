<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>游戏 HUD</title>
<style>
  :root{
    --ink: #eef2f3;
    --ink-dim: #93a1a6;
    --line: rgba(196,214,222,.18);
    --line-soft: rgba(196,214,222,.10);
    --hp: #e0503c;
    --hp-deep: #a32b20;
    --shield: #7fb0c6;
    --accent: #e8b04b;
    --slot: 3.3rem;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  *{ box-sizing: border-box; }

  .sr-only{
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  html{ font-size: clamp(13px, min(1.1vw, 1.9vh), 26px); }

  html, body{ height: 100%; }

  body{
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--font-sans);
    background:
      radial-gradient(75% 55% at 16% 2%, rgba(116,150,178,.36), rgba(40,58,72,.10) 46%, transparent 68%),
      radial-gradient(42% 38% at 82% 0%, rgba(196,142,88,.20), transparent 66%),
      radial-gradient(72% 26% at 48% 56%, rgba(104,136,154,.20), transparent 74%),
      linear-gradient(180deg, #101821 0%, #0b1319 50%, #05080a 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* 场景层：地平线、前景暗部、暗角 */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 102% at 50% 44%, transparent 40%, rgba(0,0,0,.72) 100%),
      linear-gradient(180deg, rgba(150,184,200,0) 44%, rgba(150,184,200,.075) 57%, rgba(150,184,200,.02) 64%, rgba(150,184,200,0) 71%),
      radial-gradient(72% 56% at 86% 118%, #05090c 0 56.6%, rgba(5,9,12,0) 57.1%),
      radial-gradient(86% 63% at 16% 116%, rgba(9,16,21,.94) 0 55.8%, rgba(9,16,21,0) 56.4%),
      linear-gradient(180deg, rgba(2,5,7,0) 55%, rgba(2,5,7,.55) 100%);
  }

  /* ---------- HUD 框架 ---------- */
  .hud{
    position: fixed;
    inset: 0;
    z-index: 2;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 1.2rem 1.5rem;
    padding:
      calc(env(safe-area-inset-top, 0px) + 1.8rem)
      calc(env(safe-area-inset-right, 0px) + 2rem)
      calc(env(safe-area-inset-bottom, 0px) + 1.35rem)
      calc(env(safe-area-inset-left, 0px) + 2rem);
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .label{
    font-size: .7rem;
    letter-spacing: .16em;
    color: var(--ink-dim);
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }

  /* ---------- 生命与护盾 ---------- */
  .vitals{
    position: relative;
    grid-column: 1;
    grid-row: 1;
    justify-self: start;
    width: min(20rem, 54vw);
    padding: .8rem .95rem .85rem;
    background: linear-gradient(180deg, rgba(21,28,33,.9), rgba(7,10,13,.84));
    border: 1px solid var(--line);
    border-radius: 2px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - .85rem), calc(100% - .85rem) 100%, 0 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.07),
      0 1.4rem 2.4rem -1.8rem rgba(0,0,0,.95);
    backdrop-filter: blur(10px) saturate(115%);
    -webkit-backdrop-filter: blur(10px) saturate(115%);
  }

  .vitals::after{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 3rem;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), rgba(232,176,75,0));
  }

  .v-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .7rem;
  }

  .readout{
    font-family: var(--font-mono);
    font-size: 1.42rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    text-shadow: 0 1px 4px rgba(0,0,0,.7);
  }

  .readout b{ font-weight: 600; }

  .readout-max{
    margin-left: .1rem;
    font-size: .78rem;
    font-weight: 400;
    color: var(--ink-dim);
  }

  .hp{
    position: relative;
    height: 1rem;
    margin-top: .5rem;
    background: #191d20;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden;
    clip-path: polygon(0 0, 100% 0, calc(100% - .5rem) 100%, 0 100%);
  }

  .hp-ghost{
    position: absolute;
    inset: 0 auto 0 0;
    width: 86%;
    background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.13));
  }

  .hp-fill{
    position: absolute;
    inset: 0 auto 0 0;
    width: 78%;
    background: linear-gradient(180deg, #f06750 0%, var(--hp) 46%, var(--hp-deep) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.34),
      0 0 .8rem rgba(224,80,60,.38);
  }

  .hp::after{
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    background-image: linear-gradient(90deg, rgba(0,0,0,0) calc(100% - 1.5px), rgba(5,9,11,.9) 0);
    background-size: 10% 100%;
  }

  .hp-mark{
    position: absolute;
    top: 0;
    bottom: 0;
    left: 25%;
    z-index: 3;
    width: 1px;
    background: rgba(255,255,255,.38);
  }

  .shield-row{
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr) auto;
    align-items: center;
    gap: .5rem;
    margin-top: .62rem;
  }

  .shield-icon{
    width: .86rem;
    height: .86rem;
    color: var(--shield);
    opacity: .95;
  }

  .shield-row .label{
    font-size: .64rem;
    letter-spacing: .16em;
  }

  .shield{
    height: .38rem;
    background: rgba(255,255,255,.08);
    clip-path: polygon(0 0, 100% 0, calc(100% - .3rem) 100%, 0 100%);
    overflow: hidden;
  }

  .shield-fill{
    width: 42%;
    height: 100%;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.20) 0 1px, rgba(255,255,255,0) 1px 5px),
      linear-gradient(90deg, #4d7f95, #8fc4da);
    box-shadow: 0 0 .6rem rgba(127,176,198,.4);
  }

  .shield-val{
    font-family: var(--font-mono);
    font-size: .8rem;
    font-variant-numeric: tabular-nums;
    color: #a9c9d6;
  }

  /* ---------- 分数与关卡 ---------- */
  .score{
    grid-column: 2;
    grid-row: 1;
    justify-self: end;
    align-self: start;
    text-align: right;
  }

  .score .label{
    display: block;
    font-size: .64rem;
    letter-spacing: .22em;
  }

  .score-num{
    display: block;
    margin-top: .12rem;
    font-family: var(--font-mono);
    font-size: 3.05rem;
    line-height: .92;
    font-weight: 600;
    letter-spacing: -.045em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 .1rem 1.2rem rgba(0,0,0,.8);
  }

  .score-rule{
    position: relative;
    height: 1px;
    margin-top: .6rem;
    background: linear-gradient(90deg, rgba(196,214,222,0), rgba(196,214,222,.5));
  }

  .score-rule::after{
    content: "";
    position: absolute;
    top: -2px;
    right: 0;
    width: 1.7rem;
    height: 5px;
    background: var(--accent);
  }

  .level{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: .5rem;
    margin-top: .55rem;
  }

  .level .label{
    font-size: .62rem;
    letter-spacing: .16em;
  }

  .level-num{
    padding: .1rem .42rem;
    font-family: var(--font-mono);
    font-size: 1.04rem;
    line-height: 1.3;
    font-variant-numeric: tabular-nums;
    color: #f3ce8c;
    border: 1px solid rgba(232,176,75,.45);
    background: rgba(232,176,75,.09);
  }

  /* ---------- 小地图 ---------- */
  .minimap{
    position: relative;
    grid-column: 2;
    grid-row: 2;
    justify-self: end;
    align-self: end;
    width: 11.5rem;
    height: 11.5rem;
    overflow: hidden;
    border: 1px solid rgba(196,214,222,.22);
    border-radius: 2px;
    background: radial-gradient(120% 120% at 50% 50%, #18232a 0%, #0a0f13 72%, #06090c 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.07),
      0 1.6rem 2.6rem -1.8rem rgba(0,0,0,.95);
  }

  .map-grid{
    position: absolute;
    inset: 10%;
    border: 1px solid rgba(150,180,190,.16);
    background-image:
      linear-gradient(to right, rgba(150,180,190,.12) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(150,180,190,.12) 1px, transparent 1px);
    background-size: 20% 20%;
  }

  .map-fog{
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(4,7,9,0) 36%, rgba(4,7,9,.6) 84%);
  }

  .map-scan{
    position: absolute;
    inset: 10%;
    overflow: hidden;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 46%, rgba(0,0,0,0) 94%);
    mask-image: radial-gradient(circle at 50% 50%, #000 46%, rgba(0,0,0,0) 94%);
  }

  .map-sweep{
    position: absolute;
    inset: -45%;
    background: conic-gradient(
      from 0deg,
      rgba(120,210,230,0) 0deg 292deg,
      rgba(120,210,230,.06) 322deg,
      rgba(120,210,230,.22) 352deg,
      rgba(120,210,230,.34) 359deg,
      rgba(120,210,230,0) 360deg
    );
    animation: sweep 7s linear infinite;
  }

  .map-sweep::after{
    content: "";
    position: absolute;
    left: calc(50% - .5px);
    top: 0;
    width: 1px;
    height: 50%;
    background: linear-gradient(180deg, rgba(150,224,242,0) 0%, rgba(150,224,242,.55) 78%, rgba(150,224,242,.2) 100%);
  }

  @keyframes sweep{
    to{ transform: rotate(1turn); }
  }

  .map-blip{
    position: absolute;
    width: .36rem;
    height: .36rem;
    border-radius: 50%;
    background: #dd6a58;
    box-shadow: 0 0 .5rem rgba(221,106,88,.9);
  }

  .map-blip-a{ left: 32%; top: 36%; }

  .map-blip-b{
    left: 66%;
    top: 60%;
    background: rgba(226,238,242,.72);
    box-shadow: 0 0 .4rem rgba(226,238,242,.6);
  }

  .map-self{
    position: absolute;
    left: 50%;
    top: 50%;
    width: .48rem;
    height: .58rem;
    transform: translate(-50%, -50%);
    background: var(--accent);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    filter: drop-shadow(0 0 .35rem rgba(232,176,75,.85));
  }

  .minimap::before,
  .minimap::after{
    content: "";
    position: absolute;
    z-index: 3;
    width: .7rem;
    height: .7rem;
    border: 1px solid rgba(210,226,232,.55);
  }

  .minimap::before{
    top: 0;
    left: 0;
    border-right: 0;
    border-bottom: 0;
  }

  .minimap::after{
    right: 0;
    bottom: 0;
    border-top: 0;
    border-left: 0;
  }

  /* ---------- 背包 ---------- */
  .hotbar{
    grid-column: 1 / -1;
    grid-row: 3;
    justify-self: center;
    align-self: end;
    display: flex;
    gap: .45rem;
    margin: 0;
    padding: 0;
    list-style: none;
    pointer-events: auto;
  }

  .slot{
    position: relative;
    display: grid;
    place-items: center;
    width: var(--slot);
    height: var(--slot);
    padding: 0;
    color: #dbe5e7;
    background: linear-gradient(160deg, rgba(32,41,47,.82), rgba(9,13,16,.9));
    border: 1px solid rgba(200,220,228,.20);
    border-radius: 2px;
    clip-path: polygon(0 .5rem, .5rem 0, 100% 0, 100% 100%, 0 100%);
    cursor: pointer;
    font: inherit;
    transition: border-color .15s ease, background-color .15s ease;
  }

  .slot:hover{ border-color: rgba(226,238,242,.44); }

  .slot:active{ filter: brightness(1.18); }

  .slot:focus-visible{
    outline: none;
    border-color: rgba(244,249,249,.9);
    box-shadow: inset 0 0 0 2px rgba(244,249,249,.85), inset 0 0 1.4rem rgba(232,176,75,.10);
  }

  .slot-glyph{
    width: 54%;
    height: 54%;
    opacity: .92;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }

  .slot-glyph svg{
    display: block;
    width: 100%;
    height: 100%;
  }

  .slot-count{
    position: absolute;
    right: .35rem;
    bottom: .2rem;
    font-family: var(--font-mono);
    font-size: .7rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: rgba(238,244,245,.86);
    text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }

  .slot-key{
    position: absolute;
    left: .5rem;
    top: .28rem;
    font-family: var(--font-mono);
    font-size: .6rem;
    line-height: 1;
    color: rgba(238,244,245,.56);
  }

  .slot.is-on{
    border-color: rgba(232,176,75,.85);
    background: linear-gradient(160deg, rgba(72,58,30,.6), rgba(14,13,10,.92));
    box-shadow: inset 0 0 1.2rem rgba(232,176,75,.16);
  }

  .slot.is-on::before{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--accent);
  }

  .slot.is-empty{
    background: linear-gradient(160deg, rgba(22,28,33,.6), rgba(7,10,13,.82));
    border-color: var(--line-soft);
  }

  .slot.is-on .slot-key{ color: rgba(243,206,140,.8); }

  .slot.is-empty .slot-key{ color: rgba(238,244,245,.46); }

  /* ---------- 自适应 ---------- */
  @media (max-width: 760px){
    :root{ --slot: 3rem; }

    .hud{
      gap: .85rem 1rem;
      padding:
        calc(env(safe-area-inset-top, 0px) + 1rem)
        calc(env(safe-area-inset-right, 0px) + 1rem)
        calc(env(safe-area-inset-bottom, 0px) + .9rem)
        calc(env(safe-area-inset-left, 0px) + 1rem);
    }

    .vitals{ width: min(20rem, 55vw); }
    .score-num{ font-size: 2.3rem; }
    .minimap{ width: 8rem; height: 8rem; }
    .hotbar{ gap: .25rem; }
  }

  @media (max-width: 460px){
    .vitals{ width: min(20rem, 52vw); padding: .7rem .75rem .75rem; }
    .score-num{ font-size: 1.9rem; letter-spacing: -.06em; }
    .readout{ font-size: 1.2rem; }
    .minimap{ width: 7.1rem; height: 7.1rem; }
  }

  @media (max-width: 360px){
    :root{ --slot: 2.5rem; }
    .score-num{ font-size: 1.65rem; }
  }

  @media (max-height: 520px){
    .minimap{ width: 9rem; height: 9rem; }
    .hud{
      padding-top: calc(env(safe-area-inset-top, 0px) + .9rem);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + .85rem);
    }
    .vitals{ padding: .6rem .75rem .65rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .map-sweep{ animation: none; opacity: .55; }
    .slot{ transition: none; }
  }
</style>
</head>
<body>
  <main class="hud">
    <h1 class="sr-only">游戏界面</h1>

    <section class="vitals" aria-label="生命值与护盾">
      <div class="v-head">
        <span class="label">生命值</span>
        <span class="readout"><b>78</b><span class="readout-max">/100</span></span>
      </div>
      <div class="hp" role="progressbar" aria-label="生命值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="78" aria-valuetext="78 / 100">
        <div class="hp-ghost" aria-hidden="true"></div>
        <div class="hp-fill" aria-hidden="true"></div>
        <div class="hp-mark" aria-hidden="true"></div>
      </div>
      <div class="shield-row">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 3.2 19 6v5.7c0 4.2-2.9 7.4-7 9.1-4.1-1.7-7-4.9-7-9.1V6z"/>
        </svg>
        <span class="label">护盾</span>
        <div class="shield" role="progressbar" aria-label="护盾" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42" aria-valuetext="42">
          <div class="shield-fill" aria-hidden="true"></div>
        </div>
        <span class="shield-val">42</span>
      </div>
    </section>

    <section class="score" aria-label="分数与关卡">
      <span class="label">分数</span>
      <span class="score-num">128,480</span>
      <div class="score-rule" aria-hidden="true"></div>
      <div class="level">
        <span class="label">关卡</span>
        <span class="level-num">07</span>
      </div>
    </section>

    <aside class="minimap" aria-label="小地图">
      <div class="map-grid" aria-hidden="true"></div>
      <div class="map-scan" aria-hidden="true"><div class="map-sweep"></div></div>
      <div class="map-fog" aria-hidden="true"></div>
      <div class="map-blip map-blip-a" aria-hidden="true"></div>
      <div class="map-blip map-blip-b" aria-hidden="true"></div>
      <div class="map-self" aria-hidden="true"></div>
    </aside>

    <ul class="hotbar" aria-label="背包">
      <li>
        <button type="button" class="slot is-on" aria-label="医疗包 3 个">
          <span class="slot-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <rect x="3.4" y="6.6" width="17.2" height="12.2" rx="1.6"/>
              <path d="M9 6.6V5.3c0-.7.6-1.3 1.3-1.3h3.4c.7 0 1.3.6 1.3 1.3v1.3"/>
              <path d="M12 9.9v5.6M9.2 12.7h5.6"/>
            </svg>
          </span>
          <span class="slot-count">×3</span>
          <span class="slot-key">1</span>
        </button>
      </li>
      <li>
        <button type="button" class="slot" aria-label="弹药 24 发">
          <span class="slot-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.2 8.6v9.2M12 8.6v9.2M17.8 8.6v9.2"/>
              <path d="M4.7 8.6h3M10.5 8.6h3M16.3 8.6h3"/>
              <path d="M6.2 8.6 4.7 5.4h3zM12 8.6 10.5 5.4h3zM17.8 8.6 16.3 5.4h3z"/>
            </svg>
          </span>
          <span class="slot-count">×24</span>
          <span class="slot-key">2</span>
        </button>
      </li>
      <li>
        <button type="button" class="slot" aria-label="手雷 2 枚">
          <span class="slot-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <circle cx="11.2" cy="14.2" r="5.8"/>
              <path d="M11.2 8.4V5.6h3.2"/>
              <path d="M14.4 4.4v2.4"/>
              <path d="M8.6 13h5.2M8.6 16h5.2"/>
            </svg>
          </span>
          <span class="slot-count">×2</span>
          <span class="slot-key">3</span>
        </button>
      </li>
      <li>
        <button type="button" class="slot" aria-label="护盾电池 1 个">
          <span class="slot-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6.2" y="4.6" width="11.6" height="15.8" rx="1.8"/>
              <path d="M10 4.6V3h4v1.6"/>
              <path d="M13.4 8.2 10 12.6h2.6l-.7 4 3.4-4.5h-2.6z"/>
            </svg>
          </span>
          <span class="slot-count">×1</span>
          <span class="slot-key">4</span>
        </button>
      </li>
      <li>
        <button type="button" class="slot" aria-label="门禁卡">
          <span class="slot-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <rect x="3" y="6.4" width="18" height="11.2" rx="1.6"/>
              <path d="M3 10.2h18"/>
              <path d="M7 14.4h4.6"/>
            </svg>
          </span>
          <span class="slot-key">5</span>
        </button>
      </li>
      <li>
        <button type="button" class="slot is-empty" aria-label="空槽位 6">
          <span class="slot-key">6</span>
        </button>
      </li>
