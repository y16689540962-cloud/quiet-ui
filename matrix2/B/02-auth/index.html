<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Vantage 登录</title>
<style>
  :root{
    --paper:#f1eee7;
    --surface:#fffdf8;
    --ink:#15181d;
    --ink-soft:#4e5148;
    --muted:#6f7168;
    --line:#e5e0d5;
    --line-strong:#d6d0c2;
    --accent:#e2a14a;
    --accent-deep:#8b5c17;
    --danger:#b3261e;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:40px 24px;
    background:
      radial-gradient(72% 64% at 16% 6%,#faf8f3 0,rgba(250,248,243,0) 62%),
      var(--paper);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:radial-gradient(rgba(21,24,29,.05) 1px,transparent 1px);
    background-size:22px 22px;
    -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 18%,transparent 76%);
    mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 18%,transparent 76%);
  }
  [hidden]{display:none !important}

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    display:flex;
    justify-content:center;
    margin:auto 0;
  }

  .card{
    width:min(920px,100%);
    min-height:620px;
    display:grid;
    grid-template-columns:minmax(0,.83fr) minmax(0,1fr);
    background:var(--surface);
    border:1px solid #e7e2d7;
    border-radius:22px;
    overflow:hidden;
    box-shadow:
      0 1px 2px rgba(21,24,29,.05),
      0 30px 60px -32px rgba(21,24,29,.28),
      0 3px 10px -4px rgba(21,24,29,.06);
    animation:card-in .55s cubic-bezier(.22,.7,.24,1) both;
  }
  @keyframes card-in{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:none}
  }

  /* brand side */
  .brand{
    position:relative;
    isolation:isolate;
    overflow:hidden;
    padding:38px 34px;
    color:#f6f2e9;
    background:radial-gradient(130% 100% at 8% -12%,#252c36 0%,#151a22 46%,#0b0e13 100%);
  }
  .brand::before{
    content:"";
    position:absolute;
    z-index:0;
    right:-120px;
    bottom:-150px;
    width:360px;
    height:360px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%,rgba(226,161,74,.24),rgba(226,161,74,0) 68%);
  }
  .brand::after{
    content:"";
    position:absolute;
    z-index:2;
    inset:0;
    background-image:
      linear-gradient(to right,rgba(255,255,255,.045) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 55%,transparent 92%);
    mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 55%,transparent 92%);
  }
  .lockup{
    position:relative;
    z-index:3;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mark{
    display:block;
    width:36px;
    height:36px;
    flex:none;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.35));
  }
  .wordmark{
    font-size:14px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:#f4efe4;
  }
  .art{
    position:absolute;
    z-index:1;
    right:-130px;
    bottom:-150px;
    width:470px;
    height:470px;
    pointer-events:none;
  }

  /* form side */
  .panel{
    display:flex;
    align-items:center;
    padding:52px clamp(28px,4.6vw,54px);
    background:var(--surface);
  }
  .panel-inner{
    width:100%;
    max-width:352px;
    margin:0 auto;
  }
  h1{
    margin:0 0 26px;
    font-size:28px;
    line-height:1.2;
    font-weight:600;
    letter-spacing:-.015em;
    color:var(--ink);
  }

  .oauth{display:grid;gap:10px}
  .oauth-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:46px;
    padding:0 14px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    color:#2b2f35;
    font:inherit;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .oauth-btn:hover{background:#f8f6f0;border-color:var(--line-strong)}
  .oauth-btn:active{transform:translateY(1px)}
  .oauth-btn:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}
  .oauth-icon{display:grid;place-items:center;color:#1b1f23}
  .oauth-icon svg{display:block;width:17px;height:17px}

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:22px 0;
    color:#75756a;
    font-size:12px;
    line-height:1;
  }
  .divider::before,
  .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .field{margin-bottom:15px}
  .field label{
    display:block;
    margin-bottom:7px;
    font-size:12.5px;
    line-height:1.3;
    font-weight:500;
    color:#5f6259;
  }
  .control{position:relative}
  input[type="email"],
  input[type="password"],
  input[type="text"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:47px;
    padding:0 14px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fcfaf5;
    color:var(--ink);
    font:inherit;
    font-size:14.5px;
    letter-spacing:.01em;
    transition:border-color .16s ease,background .16s ease,box-shadow .16s ease;
  }
  .control input[type="password"],
  .control input[type="text"]{padding-right:46px}
  input[type="email"]:hover,
  input[type="password"]:hover,
  input[type="text"]:hover{border-color:var(--line-strong)}
  input[type="email"]:focus,
  input[type="password"]:focus,
  input[type="text"]:focus{
    outline:none;
    background:#fff;
    border-color:#b07f33;
    box-shadow:0 0 0 3.5px rgba(226,161,74,.22);
  }
  input:-webkit-autofill{
    -webkit-text-fill-color:var(--ink);
    box-shadow:0 0 0 1000px #fcfaf5 inset;
  }

  .reveal{
    position:absolute;
    top:50%;
    right:7px;
    transform:translateY(-50%);
    display:grid;
    place-items:center;
    width:32px;
    height:32px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#8f8c82;
    cursor:pointer;
    transition:color .15s ease,background .15s ease;
  }
  .reveal:hover{color:var(--ink);background:rgba(21,24,29,.05)}
  .reveal:focus-visible{outline:2px solid var(--accent-deep);outline-offset:1px}
  .reveal svg{width:18px;height:18px}

  .field.invalid input[type="email"],
  .field.invalid input[type="password"],
  .field.invalid input[type="text"]{
    border-color:#cc5a52;
    background:#fff9f8;
  }
  .field.invalid input:focus{box-shadow:0 0 0 3.5px rgba(179,38,30,.12)}
  .err{
    display:none;
    margin:7px 0 0;
    font-size:12.5px;
    line-height:1.35;
    color:var(--danger);
  }
  .field.invalid .err{display:block}

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin:2px 0 24px;
  }
  .check{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .check input{
    position:absolute;
    width:1px;
    height:1px;
    margin:0;
    opacity:0;
    pointer-events:none;
  }
  .box{
    display:grid;
    place-items:center;
    width:18px;
    height:18px;
    flex:none;
    border:1px solid #9d9585;
    border-radius:5px;
    background:#fff;
    transition:background .16s ease,border-color .16s ease,box-shadow .16s ease;
  }
  .box svg{
    width:11px;
    height:9px;
    color:#fff;
    opacity:0;
    transform:scale(.7);
    transition:opacity .14s ease,transform .14s ease;
  }
  .check input:checked + .box{background:var(--ink);border-color:var(--ink)}
  .check input:checked + .box svg{opacity:1;transform:none}
  .check input:focus-visible + .box{box-shadow:0 0 0 3px rgba(226,161,74,.35)}

  .mini-link,
  .switch a{
    color:var(--ink);
    text-decoration:underline;
    text-decoration-color:#cfc8b8;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
    transition:text-decoration-color .15s ease,color .15s ease;
  }
  .mini-link{font-size:13px;color:#5f6259}
  .mini-link:hover,
  .switch a:hover{text-decoration-color:var(--ink)}
  .mini-link:focus-visible,
  .switch a:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;border-radius:3px}

  .submit{
    width:100%;
    height:48px;
    border:0;
    border-radius:11px;
    background:var(--ink);
    color:#fdfbf5;
    font:inherit;
    font-size:14.5px;
    font-weight:500;
    letter-spacing:.06em;
    cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,.12) inset,
      0 10px 20px -12px rgba(21,24,29,.7);
    transition:transform .16s ease,background .16s ease,box-shadow .16s ease;
  }
  .submit:hover{
    background:#23272e;
    transform:translateY(-1px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.14) inset,
      0 14px 24px -12px rgba(21,24,29,.6);
  }
  .submit:active{
    transform:translateY(0);
    box-shadow:
      0 1px 0 rgba(255,255,255,.1) inset,
      0 4px 10px -8px rgba(21,24,29,.8);
  }
  .submit:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}

  .switch{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin:24px 0 0;
    font-size:13.5px;
    color:var(--muted);
  }
  .switch a{font-weight:500}

  @media (max-width:820px){
    body{padding:24px 16px}
    .card{
      grid-template-columns:1fr;
      min-height:0;
      border-radius:19px;
    }
    .brand{
      display:flex;
      align-items:center;
      min-height:76px;
      padding:20px 22px;
    }
    .brand::before,
    .brand::after,
    .art{display:none}
    .panel{
      align-items:flex-start;
      padding:34px 24px 38px;
    }
    .panel-inner{max-width:400px}
    input[type="email"],
    input[type="password"],
    input[type="text"]{font-size:16px}
  }
  @media (max-width:420px){
    h1{font-size:24px}
    .panel{padding:30px 20px 34px}
  }
  @media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">

    <aside class="brand">
      <div class="lockup">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <rect x=".75" y=".75" width="38.5" height="38.5" rx="11" fill="#e2a14a"></rect>
          <path d="M11.5 12 20 27.5 28.5 12" fill="none" stroke="#101419" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="wordmark">Vantage</span>
      </div>

      <svg class="art" viewBox="0 0 480 480" aria-hidden="true" focusable="false">
        <circle cx="296" cy="296" r="198" fill="none" stroke="rgba(255,255,255,.08)"></circle>
        <circle cx="296" cy="296" r="146" fill="none" stroke="rgba(226,161,74,.3)"></circle>
        <circle cx="296" cy="296" r="92" fill="none" stroke="rgba(255,255,255,.07)"></circle>
        <circle cx="296" cy="296" r="7" fill="rgba(226,161,74,.9)"></circle>
        <path d="M98 296A198 198 0 0 1 296 98" fill="none" stroke="rgba(226,161,74,.55)" stroke-width="1.2" stroke-linecap="round"></path>
        <path d="M150 296A146 146 0 0 1 296 150" fill="none" stroke="rgba(255,255,255,.16)"></path>
        <circle cx="296" cy="150" r="3" fill="rgba(255,255,255,.5)"></circle>
        <line x1="296" y1="0" x2="296" y2="480" stroke="rgba(255,255,255,.035)"></line>
        <line x1="0" y1="296" x2="480" y2="296" stroke="rgba(255,255,255,.035)"></line>
      </svg>
    </aside>

    <div class="panel">
      <div class="panel-inner" id="panelInner">
        <h1 id="title">登录</h1>

        <div class="oauth" id="oauth">
          <button type="button" class="oauth-btn">
            <span class="oauth-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path fill="#4285F4" d="M23.52 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.87z"></path>
                <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.28v3.09A12 12 0 0 0 12 24z"></path>
                <path fill="#FBBC05" d="M5.27 14.29a7.2 7.2 0 0 1 0-4.58V6.62H1.28a12 12 0 0 0 0 10.76l3.99-3.09z"></path>
                <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.28 6.62l3.99 3.09C6.22 6.86 8.87 4.75 12 4.75z"></path>
              </svg>
            </span>
            <span>使用 Google 登录</span>
          </button>
          <button type="button" class="oauth-btn">
            <span class="oauth-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path fill="currentColor" d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.55v-2.1c-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.26 5.69.42.36.79 1.07.79 2.16v3.2c0 .3.21.66.8.55A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"></path>
              </svg>
            </span>
            <span>使用 GitHub 登录</span>
          </button>
        </div>

        <div class="divider" id="divider"><span>或</span></div>

        <form id="form" novalidate>
          <div class="field" id="emailField">
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" aria-describedby="emailErr">
            <p class="err" id="emailErr" role="alert" aria-live="polite"></p>
          </div>

          <div class="field" id="pwField">
            <label for="password">密码</label>
            <div class="control">
              <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="pwErr">
              <button type="button" class="reveal" id="reveal" aria-label="显示密码" aria-pressed="false">
                <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M2.5 12s3.6-6.6 9.5-6.6S21.5 12 21.5 12s-3.6 6.6-9.5 6.6S2.5 12 2.5 12Z"></path>
                  <circle cx="12" cy="12" r="2.8"></circle>
                </svg>
                <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden>
                  <path d="M2.5 12s3.6-6.6 9.5-6.6S21.5 12 21.5 12s-3.6 6.6-9.5 6.6S2.5 12 2.5 12Z"></path>
                  <circle cx="12" cy="12" r="2.8"></circle>
                  <path d="M4 4l16 16"></path>
                </svg>
              </button>
            </div>
            <p class="err" id="pwErr" role="alert" aria-live="polite"></p>
          </div>

          <div class="row" id="rememberRow">
            <label class="check">
              <input type="checkbox" id="remember" name="remember" checked>
              <span class="box" aria-hidden="true">
                <svg viewBox="0 0 12 10" fill="none" focusable="false">
                  <path d="M1 5.3 4.4 8.7 11 1.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
              <span>记住我</span>
            </label>
            <a class="mini-link" href="#forgot">忘记密码？</a>
          </div>

          <button class="submit" id="submitBtn" type="submit">登录</button>
        </form>

        <p class="switch">
          <span id="switchPrompt">还没有账号？</span>
          <a href="#register" id="switchLink">注册</a>
        </p>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  var $ = function (selector) { return document.querySelector(selector); };

  var panelInner = $('#panelInner');
  var title = $('#title');
  var oauth = $('#oauth');
  var divider = $('#divider');
  var rememberRow = $('#rememberRow');
  var switchPrompt = $('#switchPrompt');
  var switchLink = $('#switchLink');
  var form = $('#form');
  var submitBtn = $('#submitBtn');
  var email = $('#email');
  var password = $('#password');
  var emailField = $('#emailField');
  var pwField = $('#pwField');
  var emailErr = $('#emailErr');
  var pwErr = $('#pwErr');
  var reveal = $('#reveal');
  var eyeOpen = $('#eyeOpen');
  var eyeOff = $('#eyeOff');

  var mode = 'login';
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function showError(field, errEl, message) {
    field.classList.add('invalid');
    errEl.textContent = message;
    field.querySelector('input').setAttribute('aria-invalid', 'true');
  }

  function clearError(field, errEl) {
    field.classList.remove('invalid');
    errEl.textContent = '';
    field.querySelector('input').removeAttribute('aria-invalid');
  }

  function clearErrors() {
    clearError(emailField, emailErr);
    clearError(pwField, pwErr);
  }

  function setMode(next) {
    mode = next;
    var register = mode === 'register';

    title.textContent = register ? '创建账号' : '登录';
    submitBtn.textContent = register ? '创建账号' : '登录';
    oauth.hidden = register;
    divider.hidden = register;
    rememberRow.hidden = register;
    switchPrompt.textContent = register ? '已有账号？' : '还没有账号？';
    switchLink.textContent = register ? '登录' : '注册';
    password.setAttribute('autocomplete', register ? 'new-password' : 'current-password');
    document.title = register ? 'Vantage 注册' : 'Vantage 登录';
    clearErrors();

    if (!reduceMotion && panelInner.animate) {
      panelInner.animate(
        [
          { opacity: 0.3, transform: 'translateY(5px)' },
          { opacity: 1, transform: 'translateY(0)' }
        ],
        { duration: 260, easing: 'cubic-bezier(.22,.7,.24,1)' }
      );
    }
  }

  switchLink.addEventListener('click', function (event) {
    event.preventDefault();
    setMode(mode === 'login' ? 'register' : 'login');
  });

  email.addEventListener('input', function () {
    clearError(emailField, emailErr);
  });

  password.addEventListener('input', function () {
    clearError(pwField, pwErr);
  });

  reveal.addEventListener('click', function () {
    var show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    eyeOpen.hidden = show;
    eyeOff.hidden = !show;
    reveal.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    reveal.setAttribute('aria-pressed', show ? 'true' : 'false');
    password.focus({ preventScroll: true });
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    clearErrors();

    var firstInvalid = null;
    var emailValue = email.value.trim();

    if (!emailValue) {
      showError(emailField, emailErr, '请输入邮箱');
      firstInvalid = email;
    } else if (!EMAIL.test(emailValue)) {
      showError(emailField, emailErr, '请输入有效的邮箱地址');
      firstInvalid = email;
    }

    if (!password.value) {
      showError(pwField, pwErr, '请输入密码');
      firstInvalid = firstInvalid || password;
    } else if (password.value.length < 8) {
      showError(pwField, pwErr, '密码至少 8 个字符');
      firstInvalid = firstInvalid || password;
    }

    if (firstInvalid) {
      firstInvalid.focus();
    }
  });
})();
</script>
</body>
</html>
