<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账户设置</title>
<style>
  :root{
    color-scheme:light;
    --paper:#f4f2ec;
    --surface:#fffefb;
    --ink:#1c1b17;
    --muted:#6d6960;
    --line:#e4e0d6;
    --line-strong:#cbc5b6;
    --accent:#2c6e57;
    --accent-wash:#eef3ef;
    --accent-line:#d6e1d9;
    --amber:#8a5a12;
    --radius:14px;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    background:var(--paper);
    background-image:radial-gradient(1100px 520px at 50% -8%, #faf8f3 0%, rgba(250,248,243,0) 72%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:rgba(44,110,87,.16)}

  .page{
    max-width:1000px;
    margin:0 auto;
    padding:64px 32px 120px;
  }

  h1{
    margin:0 0 42px;
    font-size:24px;
    font-weight:600;
    letter-spacing:-.02em;
  }

  .layout{
    display:grid;
    grid-template-columns:176px minmax(0,1fr);
    gap:56px;
    align-items:start;
  }

  .layout main{min-width:0}

  .nav{
    position:sticky;
    top:48px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .nav a{
    margin-left:-1.5px;
    padding:7px 0 7px 16px;
    border-left:1.5px solid transparent;
    color:var(--muted);
    font-size:14px;
    text-decoration:none;
    transition:color .15s ease,border-color .15s ease;
  }

  .nav a:hover{color:var(--ink)}

  .nav a[aria-current="true"]{
    color:var(--ink);
    border-left-color:var(--ink);
    font-weight:500;
  }

  .nav a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
    border-radius:2px;
  }

  section{scroll-margin-top:40px}
  section + section{margin-top:64px}

  h2{
    display:flex;
    align-items:center;
    gap:18px;
    margin:0 0 18px;
    font-size:16px;
    font-weight:600;
  }

  h2::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  h3{
    display:flex;
    align-items:center;
    gap:16px;
    margin:32px 0 12px;
    font-size:14px;
    font-weight:600;
  }

  h3::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .card{
    padding:26px 28px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 1px 1px rgba(28,27,23,.02);
  }

  /* 个人资料 */
  .avatar-row{
    display:flex;
    align-items:center;
    gap:18px;
    padding-bottom:24px;
    border-bottom:1px solid var(--line);
  }

  .avatar{
    display:grid;
    place-items:center;
    width:60px;
    height:60px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 1px rgba(44,110,87,.18), 0 3px 8px rgba(44,110,87,.18);
    color:#f4f9f5;
    font-size:24px;
    font-weight:500;
    line-height:1;
  }

  .avatar-actions{display:flex;align-items:center;gap:10px}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:36px;
    padding:0 16px;
    border:1px solid transparent;
    border-radius:9px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    line-height:1;
    cursor:pointer;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }

  .btn-ghost{
    background:transparent;
    border-color:var(--line-strong);
    color:var(--ink);
  }

  .btn-ghost:hover{
    background:#f1eee6;
    border-color:#c4bdad;
  }

  .btn-primary{
    background:var(--ink);
    color:#fbfaf6;
  }

  .btn-primary:hover{background:#000}

  .btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  #avatar-file:focus-visible + .btn-ghost{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .fields{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
    padding-top:24px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:7px;
    min-width:0;
  }

  .field label{
    color:var(--muted);
    font-size:12.5px;
  }

  .field input{
    height:40px;
    padding:0 12px;
    border:1px solid var(--line-strong);
    border-radius:9px;
    background:#fbfaf6;
    color:var(--ink);
    font:inherit;
    font-size:14px;
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
  }

  .field input:hover{border-color:#bfb8a8}

  .field input:focus{
    outline:none;
    background:#fff;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(44,110,87,.12);
  }

  .form-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:24px;
  }

  /* 通知偏好 */
  .card-flush{padding:4px 28px}

  .pref{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:15px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }

  .pref:last-child{border-bottom:none}
  .pref-name{font-size:14px}

  .switch{
    position:relative;
    flex:none;
    width:42px;
    height:24px;
  }

  .switch input{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    margin:0;
    opacity:0;
    cursor:pointer;
  }

  .track{
    position:absolute;
    inset:0;
    border-radius:999px;
    background:#d8d3c6;
    box-shadow:inset 0 0 0 1px rgba(28,27,23,.06);
    pointer-events:none;
    transition:background .18s ease;
  }

  .track::after{
    content:"";
    position:absolute;
    top:3px;
    left:3px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#fffefb;
    box-shadow:0 1px 2px rgba(28,27,23,.28);
    transition:transform .2s cubic-bezier(.2,.8,.3,1);
  }

  .switch input:checked + .track{background:var(--accent)}
  .switch input:checked + .track::after{transform:translateX(18px)}

  .switch input:focus-visible + .track{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  /* 账单 */
  .plan{
    padding:24px 28px;
    background:var(--accent-wash);
    border-color:var(--accent-line);
  }

  .plan-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
  }

  .plan-name{
    margin:0 0 6px;
    color:#22483c;
    font-size:14px;
    font-weight:500;
  }

  .plan-price{
    display:flex;
    align-items:baseline;
    gap:7px;
    margin:0;
  }

  .amount{
    font-size:30px;
    font-weight:600;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    line-height:1.1;
  }

  .per{
    color:var(--muted);
    font-size:13px;
  }

  .plan-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin:22px 0 0;
    padding-top:16px;
    border-top:1px solid var(--accent-line);
    font-size:13.5px;
  }

  .plan-meta dt{color:var(--muted)}
  .plan-meta dd{margin:0;font-variant-numeric:tabular-nums}

  .table-wrap{padding:6px 8px}

  table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }

  caption{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
  }

  th{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    color:var(--muted);
    font-size:12px;
    font-weight:500;
    text-align:left;
  }

  td{
    padding:14px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }

  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s ease}
  tbody tr:hover{background:#fbfaf6}

  .num{
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  .paid{color:var(--accent)}
  .pending{color:var(--amber)}

  .download{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-size:13px;
    text-decoration:none;
    transition:color .15s ease;
  }

  .download:hover{color:var(--ink)}
  .download:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

  .download svg{
    width:13px;
    height:13px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  td.action{text-align:right}

  .sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
    border:0;
  }

  @media (max-width:860px){
    .page{padding:40px 20px 88px}
    h1{margin-bottom:28px;font-size:22px}

    .layout{grid-template-columns:1fr;gap:28px}

    .nav{
      position:static;
      flex-direction:row;
      gap:8px;
      overflow-x:auto;
      padding-bottom:2px;
    }

    .nav a{
      margin-left:0;
      padding:6px 13px;
      border:1px solid var(--line);
      border-radius:999px;
      white-space:nowrap;
    }

    .nav a[aria-current="true"]{
      border-color:var(--line-strong);
      background:var(--surface);
    }
  }

  @media (max-width:620px){
    .card{padding:20px}
    .card-flush{padding:2px 20px}
    .plan{padding:20px}
    .plan-top{flex-wrap:wrap;row-gap:14px}
    .fields{grid-template-columns:1fr;gap:16px}
    .form-actions{margin-top:20px}

    .table-wrap{padding:2px 8px}
    table{display:block}
    thead{
      position:absolute;
      width:1px;
      height:1px;
      overflow:hidden;
      clip:rect(0 0 0 0);
      white-space:nowrap;
    }
    tbody{display:block}
    tbody tr{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      grid-template-areas:"date amount" "status action";
      column-gap:14px;
      row-gap:7px;
      align-items:center;
      padding:13px 6px;
      border-bottom:1px solid var(--line);
    }
    tbody tr:last-child{border-bottom:none}
    td{
      min-width:0;
      padding:0;
      border-bottom:none;
      font-size:13.5px;
    }
    td:nth-child(1){grid-area:date}
    td:nth-child(2){grid-area:amount;text-align:right}
    td:nth-child(3){grid-area:status;font-size:12.5px}
    td.action{grid-area:action;text-align:right}
    .download{font-size:12.5px;gap:5px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="page">
  <h1>账户设置</h1>

  <div class="layout">
    <nav class="nav" aria-label="设置分区">
      <a href="#profile" aria-current="true">个人资料</a>
      <a href="#notifications">通知偏好</a>
      <a href="#billing">账单</a>
    </nav>

    <main>
      <section id="profile" aria-labelledby="profile-title">
        <h2 id="profile-title">个人资料</h2>
        <form class="card" onsubmit="return false">
          <div class="avatar-row">
            <div class="avatar" aria-hidden="true">陈</div>
            <div class="avatar-actions">
              <input class="sr-only" type="file" id="avatar-file" accept="image/*">
              <label class="btn btn-ghost" for="avatar-file">更换头像</label>
            </div>
          </div>

          <div class="fields">
            <div class="field">
              <label for="name">姓名</label>
              <input id="name" name="name" type="text" value="陈昱" autocomplete="name">
            </div>
            <div class="field">
              <label for="email">邮箱</label>
              <input id="email" name="email" type="email" value="chenyu@northline.cn" autocomplete="email">
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </section>

      <section id="notifications" aria-labelledby="notifications-title">
        <h2 id="notifications-title">通知偏好</h2>
        <div class="card card-flush">
          <label class="pref" for="notify-product">
            <span class="pref-name">产品更新</span>
            <span class="switch">
              <input type="checkbox" id="notify-product" role="switch" checked>
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>

          <label class="pref" for="notify-replies">
            <span class="pref-name">评论回复</span>
            <span class="switch">
              <input type="checkbox" id="notify-replies" role="switch" checked>
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>

          <label class="pref" for="notify-weekly">
            <span class="pref-name">每周摘要</span>
            <span class="switch">
              <input type="checkbox" id="notify-weekly" role="switch">
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>

          <label class="pref" for="notify-billing">
            <span class="pref-name">账单提醒</span>
            <span class="switch">
              <input type="checkbox" id="notify-billing" role="switch" checked>
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>
        </div>
      </section>

      <section id="billing" aria-labelledby="billing-title">
        <h2 id="billing-title">账单</h2>

        <div class="card plan">
          <div class="plan-top">
            <div>
              <p class="plan-name">团队版</p>
              <p class="plan-price">
                <span class="amount">¥299</span>
                <span class="per">每月</span>
              </p>
            </div>
            <button class="btn btn-ghost" type="button">更改套餐</button>
          </div>

          <dl class="plan-meta">
            <dt>下次扣款</dt>
            <dd>2026年12月3日</dd>
          </dl>
        </div>

        <h3>发票</h3>
        <div class="card table-wrap">
          <table>
            <caption>发票列表</caption>
            <colgroup>
              <col style="width:32%">
              <col style="width:20%">
              <col style="width:24%">
              <col style="width:24%">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">日期</th>
                <th scope="col" class="num">金额</th>
                <th scope="col">状态</th>
                <th scope="col" class="num">下载</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>2026年11月3日</td>
                <td class="num">¥299.00</td>
                <td class="paid">已支付</td>
                <td class="action">
                  <a class="download" href="#" aria-label="下载2026年11月发票">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8m0 0L4.9 7.4M8 10.5l3.1-3.1M3 13.5h10"/></svg>
                    下载
                  </a>
                </td>
              </tr>
              <tr>
                <td>2026年10月3日</td>
                <td class="num">¥299.00</td>
                <td class="paid">已支付</td>
                <td class="action">
                  <a class="download" href="#" aria-label="下载2026年10月发票">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8m0 0L4.9 7.4M8 10.5l3.1-3.1M3 13.5h10"/></svg>
                    下载
                  </a>
                </td>
              </tr>
              <tr>
                <td>2026年9月3日</td>
                <td class="num">¥299.00</td>
                <td class="paid">已支付</td>
                <td class="action">
                  <a class="download" href="#" aria-label="下载2026年9月发票">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8m0 0L4.9 7.4M8 10.5l3.1-3.1M3 13.5h10"/></svg>
                    下载
                  </a>
                </td>
              </tr>
              <tr>
                <td>2026年8月3日</td>
                <td class="num">¥299.00</td>
                <td class="paid">已支付</td>
                <td class="action">
                  <a class="download" href="#" aria-label="下载2026年8月发票">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8m0 0L4.9 7.4M8 10.5l3.1-3.1M3 13.5h10"/></svg>
                    下载
                  </a>
                </td>
              </tr>
              <tr>
                <td>2026年7月3日</td>
                <td class="num">¥299.00</td>
                <td class="pending">处理中</td>
                <td class="action"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('.nav a'));
  var targets = links.map(function (link) {
    return document.querySelector(link.getAttribute('href'));
  });
  var ticking = false;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function setActive(index) {
    links.forEach(function (link, i) {
      if (i === index) {
        link.setAttribute('aria-current', 'true');
      } else {
        link.removeAttribute('aria-current');
      }
    });
  }

  function update() {
    var index = 0;
    targets.forEach(function (target, i) {
      if (target && target.getBoundingClientRect().top <= 140) index = i;
    });
    setActive(index);
    ticking = false;
  }

  window.addEventListener('scroll', function () {
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(update);
    }
  }, { passive: true });

  window.addEventListener('resize', update);

  links.forEach(function (link, i) {
    link.addEventListener('click', function (event) {
      var target = targets[i];
      if (!target) return;
      event.preventDefault();
      setActive(i);
      target.scrollIntoView({
        behavior: reduce.matches ? 'auto' : 'smooth',
        block: 'start'
      });
      if (history.replaceState) {
        try {
          history.replaceState(null, '', link.getAttribute('href'));
        } catch (error) {}
      }
    });
  });

  update();
})();
</script>
</body>
</html>
